name: Benchmark — FSE'26 RCABench

on:
  workflow_dispatch:
    inputs:
      shard_tag:
        description: 'rcabench-data release tag holding the shards (never `latest`). EMPTY = resolve it from this checkout''s converter digest, which is the only property that identifies a usable cache: the workflow lists every released cache, reads its manifest digest, and selects the one this converter produced (refusing when none or several match). An explicit tag PINS the cache and is still refused by the provenance gate below unless its manifest was built from this checkout. The pinned default this input used to carry (`rcabench-latency-full`) went stale on 2026-11-08, when the converter gained the pod-lifecycle channel: for one iteration every bare dispatch was refused by its own gate, and the refusal named two digests and no tag'
        required: false
        default: ''
      categories:
        description: 'Comma-separated fault categories to download (empty = all 7)'
        required: false
        default: ''
      max_cases:
        description: 'Number of datapacks to evaluate (empty = the runner default, which is all downloaded)'
        required: false
        default: ''
      log_weight:
        description: 'Log-signal weight (empty = the runner default, which is the measured 1.0)'
        required: false
        default: ''
      log_mode:
        description: 'Log-signal scoring mode (empty = the runner default, which is logicHttp, the best-measured mode; count = logic-exception, logicHttp = logic + framework HTTP, logicHttpJoint = logic + topology-gated framework HTTP, logicHttpDominant = logic + concentration-gated framework HTTP, all = every error). The value is named because this is the input whose drift once cost 24.2pp, and "the best-measured mode" is a phrase no guard can check against the runner''s own constant'
        required: false
        default: ''
      diagnose:
        description: 'Comma-separated fault types to dump a per-service signal diagnostic for (empty = none)'
        required: false
        default: ''
      diagnose_limit:
        description: 'Max diagnostic dumps per matching fault type (empty = the runner default, which is 3; 0 = unlimited)'
        required: false
        default: ''
      diagnose_decimals:
        description: 'Decimals the diagnostic dump renders its per-service fields at, and DECLARES in its header (empty = the runner default, which is 3). A reader derives its error bar from that declaration, so a finer dump is the only way to test whether the one window that answers `needs 1` survives the change'
        required: false
        default: ''
      rise_ceiling:
        description: 'Ceiling on the relative deviation one metric may contribute (empty = the runner default, which is unbounded)'
        required: false
        default: ''
      fleet_baseline:
        description: "Set to anything non-empty to subtract each metric's cross-service median before the service maximum (empty = the runner default, which is off)"
        required: false
        default: ''
      no_rank_normalization:
        description: "Set to anything non-empty to rank the services by score instead of normalising each to its rank (empty = the runner default, which is ON). rankNormalization confines the metric term to [0,1], which is the reason the log term can outvote it. The golden half's description of this same input has always named the ON; this one stated it in words, so one input had two descriptions and only one of them could be checked"
        required: false
        default: ''
      anomaly_normalize_threshold:
        description: 'The node count at or above which rank normalisation runs at all (empty = the runner default, the shipped 20). The flag above picks WHICH rescale; this picks WHETHER one runs, and it is therefore the axis population: on RCAEval 487 of 735 cases sit below the shipped count, so the flag is unread on two thirds of that corpus, while this corpus is the large-graph one where it acts nearly everywhere. Set it to 0 to rescale every graph'
        required: false
        default: ''
      ranking_knobs:
        description: "Comma-separated name=value pairs for the eight ranking knobs that a dispatch could not state until iteration 96. They are ONE input rather than eight because of a HARD GITHUB LIMIT, not a preference: a workflow_dispatch accepts at most 25 inputs, naming them one per input took this workflow to 30, and the workflow file was therefore INVALID - the push-triggered validation run failed and the dispatch was refused with HTTP 422. Accepted names: trace_weight, topo_weight, collision_weight, prism_weight, prism_pooling, collapse_discount, suppress_idle_transients, suppress_near_zero_baseline_rise, anomaly_trend_weight, anomaly_burst_weight, anomaly_cv_weight, anomaly_breadth_weight, anomaly_breadth_gate, self_time_weight, victim_weight, self_anomaly_weight, dual_family_weight, dual_family_gate, dual_family_gate_mode, pod_state_weight, trace_skips_leader, drop_deviation, zero_baseline_latency, cap_trend_bonus, rise_ceiling, baseline_anchor, topo_discount, topo_scope, topo_discount_gate, topo_closure, log_normalisation, transient_guard_test. The topological deduction is TWO names because they answer two questions - how much of an explained anomaly is deducted, and which channels a callee is allowed to explain (`all` is the ablation arm of the shipped `external`, `caller` restricts only the caller-side channel) - and its weight ships at 0, so a bare dispatch is unchanged by construction. The two suppression switches take 1 to switch ON and 0 to switch OFF (emitting the runner's own negated pole); every other name takes its value verbatim, and a malformed VALUE falls back to the runner's shipped value on the CLI's own rule rather than inventing a configuration. Example: suppress_idle_transients=1,trace_weight=1. An unrecognised NAME fails the step rather than being dropped, because a silently ignored knob is a run that reports a configuration nobody asked for"
        required: false
        default: ''
      drop_metrics:
        description: 'Comma-separated metric labels to strip from every case before scoring (empty = no ablation). Applied at load time, so the engine is unchanged'
        required: false
        default: ''
      event_extra_labels:
        description: 'Comma-separated metric labels to ADMIT to the event family, as a converter spells them (empty = the shipped family, `error`). The complement of drop_metrics and it exists because the two converters that produced this project''s two corpora spell one physical quantity two ways: RCAEval writes `error`, FSE''26 writes `http.response.error_rate`, so the guard''s post-injection repair is unreachable on this archive without this switch. Admitting the FSE''26 spelling run-wide is MEASURED and REFUSED (Top@1 1073 → 1082 with four fault types down, docs/duty-cycle-window.md §5); this input is the surface that keeps the refusal re-measurable, and the acceptance test that would reverse it is Top@1 >= 1082 with no fault type down'
        required: false
        default: ''
      failed_edge_weight:
        description: 'Weight of the failed-edge-direction signal, which charges each failed call to its CALLEE (empty = the runner default, which is the SHIPPED 3: a gated term worth +41 cases on this corpus with zero regressed fault types). Set it to 0 for the ablation, which is the configuration every published cell before iteration 125 ran'
        required: false
        default: ''
      failed_edge_mode:
        description: 'Aggregation for the failed-edge signal: sum (empty = the runner default) or mean, which divides a callee net failures by its number of failing callers'
        required: false
        default: ''
      failed_edge_min_records:
        description: 'Minimum contributing edges a callee needs before the failed-edge signal credits it (empty = the runner default, which is 1). A single record is one event, not an interface failure'
        required: false
        default: ''
      lat_weight:
        description: 'Weight of the per-edge latency-rise signal, which credits the CALLEE of a call whose span duration rose (empty = the runner default, which is the shipped 0.561495 = the cap of the zero-regression window for the shipped rise floor 10.3; 0 is the pre-flip ablation). It needs rcabench-latency-full or newer, whose shards carry traceEdgeLatency'
        required: false
        default: ''
      lat_min_rise:
        description: 'Rise a service must clear before the latency-rise signal credits it (empty = the runner default, which is the shipped 10.3, just above the 10.283 rise of the single competitor that bound the previous window). Above 1 the term becomes a precision instrument: it stops crediting rises that are too small to be evidence, which also removes them as SPURIOUS COMPETITORS. It needs rcabench-latency-full or newer'
        required: false
        default: ''
      pool_penalty:
        description: 'Weight of the DB-connection-pool dominance PENALTY, subtracted from a service whose anomaly maximum was won by a db.client.connections.* series (empty = the runner default, which is the shipped 0.0679 = the midpoint of the measured zero-regression window w in (0.048823, 0.087011), worth +6 cases against 0 lost and 0 regressed fault types; 0 is the pre-ship ablation)'
        required: false
        default: ''
      stability_weight:
        description: "Weight of the decisive-stability prior, which credits the service whose dominant metric has the LOWEST dispersion bonus (empty = the runner default, which is the SHIPPED 0.007352 = the midpoint of the criterion intersection, not of the FSE'26 window). The window solved on this benchmark alone is [0.029860, 0.030480] worth +6, but 0.030170 moved four of the nine golden cells, so that point is REJECTED and 0.007352 is the value the intersection licenses: +1 case, zero regressed fault types, golden byte-identical"
        required: false
        default: ''
      temporal_weight:
        description: "Weight of the injection-anchored temporal prior, which credits the service whose dominant metric left its pre-injection baseline FIRST (empty = the runner default, which is 0 = OFF). It was SHIPPED once at 0.036552 and REVERTED, and both halves of the measurement are on record: on FSE'26 it gained 4 cases of 1422 with 0 regressed fault types, while on RCAEval it moved SIX of the nine golden cells — RE1 TrainTicket 68.0 to 27.2 and RE2 68.1 to 25.7, reproduced identically on a second run. Pass 0.036552 only to re-measure the rejection, never as a candidate"
        required: false
        default: ''
      onset_shape:
        description: "Shape the temporal prior reads the onset delays in (empty = the runner default, which is earliness, the engine's own min-max normalisation and the shape every published number was measured with): order is linear in the onset RANK, earliest-only credits ONLY whoever moved first, latest-only is a REVERSED control. It is a PAIR with temporal_weight, because a weight is a claim about a shape — earliest-only is the shape the REVERTED 0.036552 candidate was measured on, so do not pair it with a non-zero weight without re-measuring BOTH halves of the kill criterion"
        required: false
        default: ''
      terms_dump:
        description: 'Emit the per-candidate TERM dump (fse26-terms.ndjson) alongside the results. Each line is one case; each candidate carries the engine''s own named terms with the weight and slope that produced each contribution, so any weight vector can be re-scored offline as sum (w''-w)*slope from this one artifact. This is what makes a weight or architecture screen a local computation instead of one dispatch per candidate configuration. It costs a second full ranking pass over each case (the dump needs EVERY candidate, not the shipped top 5), so it is off unless asked for, and it changes nothing about the score. Set to anything non-empty to emit it; empty writes nothing'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The corpus, through the ONE owner of "which released cache can this checkout consume".
      #   What used to be three inline steps here -- resolve the tag from the converter digest, download the
      #   seven shards, verify the manifest's digest and every shard's size and sha256 -- now lives in
      #   `.github/actions/rcabench-shards`, and it moved for the reason `docs/sota-comparison.md` §0p records
      #   twice: a second copy of a guard is a guard enforced in one place and skipped in another. The agentic
      #   study (`.github/workflows/benchmark-agentic.yml`) is the second consumer, of the same corpus.
      #
      #   The two behaviours this file used to state inline are preserved verbatim in the action, because both
      #   were paid for by a wrong run: the tag is DISCOVERED rather than defaulted (a pinned default went
      #   stale when the converter gained the pod-lifecycle channel, and every bare dispatch was refused by
      #   its own gate), and `releases/latest` is never used (re-uploading assets with `--clobber` does not
      #   refresh `published_at`, so `latest` served the superseded `rcabench-full-v2` to a full run).
      - name: Fetch the converted corpus
        id: corpus
        uses: ./.github/actions/rcabench-shards
        with:
          tag: ${{ inputs.shard_tag }}
          categories: ${{ inputs.categories }}

      # ── TypeScript engine ──
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run FSE'26 benchmark
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          set -o pipefail
          #   Every override below follows ONE rule: pass the flag only when the
          #   dispatch input is non-empty, so the runner's own default is the
          #   single owner of the configuration. That rule is not cosmetic. An
          #   empty `--log-weight` parses to 0 (14.98% Top@1) and an empty
          #   `--diagnose-limit` parses to 0 (unlimited dumps), so forwarding an
          #   empty input is a silent configuration change, not a no-op.
          #   `packages/kinetic/__tests__/unit/fse26-reported-config.test.ts`
          #   fails the build if a runner-owned input ever carries a literal
          #   default here again.
          MAX_CASES_ARG=()
          if [ -n "${{ inputs.max_cases }}" ]; then
            MAX_CASES_ARG=(--max-cases "${{ inputs.max_cases }}")
          fi
          #   The log-signal mode is passed only when the dispatch input is
          #   non-empty, so the runner's own default is the single source of
          #   truth for the published configuration. A hardcoded default here
          #   would be a second copy that can silently drift from the
          #   best-measured mode -- which is exactly what happened while this
          #   file defaulted to `count` (Top@1 23.1%) and `logicHttp` measured
          #   47.3% on the same cache (runs 34604119657 / 34604105028).
          DIAGNOSE_ARG=()
          if [ -n "${{ inputs.diagnose }}" ]; then
            DIAGNOSE_ARG=(--diagnose "${{ inputs.diagnose }}")
          fi
          DIAGNOSE_LIMIT_ARG=()
          if [ -n "${{ inputs.diagnose_limit }}" ]; then
            DIAGNOSE_LIMIT_ARG=(--diagnose-limit "${{ inputs.diagnose_limit }}")
          fi
          #   The dump's render precision. Passed only when the input is non-empty, like every
          #   other override here, so the runner's own default stays the single owner: an empty
          #   `--diagnose-decimals` parses to the producer's default rather than to 0, which would
          #   be a legal but entirely different artifact.
          DIAGNOSE_DECIMALS_ARG=()
          if [ -n "${{ inputs.diagnose_decimals }}" ]; then
            DIAGNOSE_DECIMALS_ARG=(--diagnose-decimals "${{ inputs.diagnose_decimals }}")
          fi
          # The term dump is a boolean and it WRITES a file rather than setting a knob, so it is expanded to a
          # path the runner owns here instead of being passed through: a caller that had to name the path would
          # be able to place the artifact outside the upload set, which is a run whose instrument silently
          # produced nothing.
          TERMS_ARG=()
          if [ -n "${{ inputs.terms_dump }}" ]; then
            TERMS_ARG=(--terms-dump fse26-terms.ndjson)
          fi
          LOG_WEIGHT_ARG=()
          if [ -n "${{ inputs.log_weight }}" ]; then
            LOG_WEIGHT_ARG=(--log-weight "${{ inputs.log_weight }}")
          fi
          LOG_MODE_ARG=()
          if [ -n "${{ inputs.log_mode }}" ]; then
            LOG_MODE_ARG=(--log-mode "${{ inputs.log_mode }}")
          fi
          #   Same rule as the log mode: passed only when the dispatch input is
          #   non-empty, so the runner's default (unbounded) is the single source
          #   of truth for the shipped configuration. The value the run actually
          #   used is echoed in the `Config:` line and in the artifact's `config`
          #   block, so an ablation is distinguishable from a published run.
          RISE_CEILING_ARG=()
          if [ -n "${{ inputs.rise_ceiling }}" ]; then
            RISE_CEILING_ARG=(--rise-ceiling "${{ inputs.rise_ceiling }}")
          fi
          FLEET_BASELINE_ARG=()
          if [ -n "${{ inputs.fleet_baseline }}" ]; then
            FLEET_BASELINE_ARG=(--fleet-baseline)
          fi
          RANK_NORM_ARG=()
          if [ -n "${{ inputs.no_rank_normalization }}" ]; then
            RANK_NORM_ARG=(--no-rank-normalization)
          fi
          # The axis's second half, in the same array as the boolean: a dispatch that could state the flag
          # and not the population could not measure which cases the flag reached.
          if [ -n "${{ inputs.anomaly_normalize_threshold }}" ]; then
            RANK_NORM_ARG+=(--anomaly-normalize-threshold "${{ inputs.anomaly_normalize_threshold }}")
          fi
          DROP_METRICS_ARG=()
          if [ -n "${{ inputs.drop_metrics }}" ]; then
            DROP_METRICS_ARG=(--drop-metrics "${{ inputs.drop_metrics }}")
          fi
          # The complement of the ablation above: labels to ADD to the event family rather than remove from a
          # case. Two switches rather than one signed list because they answer two questions, and because a
          # single list with a +/− prefix is a parser nobody can read off the artifact.
          EVENT_EXTRA_ARG=()
          if [ -n "${{ inputs.event_extra_labels }}" ]; then
            EVENT_EXTRA_ARG=(--event-extra-labels "${{ inputs.event_extra_labels }}")
          fi
          FAILED_EDGE_ARG=()
          if [ -n "${{ inputs.failed_edge_weight }}" ]; then
            FAILED_EDGE_ARG=(--failed-edge-weight "${{ inputs.failed_edge_weight }}")
          fi
          FAILED_EDGE_MODE_ARG=()
          if [ -n "${{ inputs.failed_edge_mode }}" ]; then
            FAILED_EDGE_MODE_ARG=(--failed-edge-mode "${{ inputs.failed_edge_mode }}")
          fi
          FAILED_EDGE_MIN_ARG=()
          if [ -n "${{ inputs.failed_edge_min_records }}" ]; then
            FAILED_EDGE_MIN_ARG=(--failed-edge-min-records "${{ inputs.failed_edge_min_records }}")
          fi
          LAT_ARG=()
          if [ -n "${{ inputs.lat_weight }}" ]; then
            LAT_ARG=(--lat-weight "${{ inputs.lat_weight }}")
          fi
          LAT_FLOOR_ARG=()
          if [ -n "${{ inputs.lat_min_rise }}" ]; then
            LAT_FLOOR_ARG=(--lat-min-rise "${{ inputs.lat_min_rise }}")
          fi
          POOL_ARG=()
          if [ -n "${{ inputs.pool_penalty }}" ]; then
            POOL_ARG=(--pool-penalty "${{ inputs.pool_penalty }}")
          fi
          STABILITY_ARG=()
          if [ -n "${{ inputs.stability_weight }}" ]; then
            STABILITY_ARG=(--stability-weight "${{ inputs.stability_weight }}")
          fi
          TEMPORAL_ARG=()
          if [ -n "${{ inputs.temporal_weight }}" ]; then
            TEMPORAL_ARG=(--temporal-weight "${{ inputs.temporal_weight }}")
          fi
          ONSET_SHAPE_ARG=()
          if [ -n "${{ inputs.onset_shape }}" ]; then
            ONSET_SHAPE_ARG=(--onset-shape "${{ inputs.onset_shape }}")
          fi
          # The eight knobs, through ONE input. The allow-list BELOW is the point rather than the parsing:
          # every flag is spelled here in code, so the dispatch-surface census still reads a reach rather than
          # a promise, and an unrecognised NAME exits non-zero instead of being dropped - a silently ignored
          # knob is a run whose configuration line reports something nobody asked for.
          KNOB_ARGS=()
          if [ -n "${{ inputs.ranking_knobs }}" ]; then
            IFS=',' read -ra KNOB_PAIRS <<< "${{ inputs.ranking_knobs }}"
            for pair in "${KNOB_PAIRS[@]}"; do
              pair="$(printf '%s' "$pair" | tr -d '[:space:]')"
              if [ -z "$pair" ]; then
                continue
              fi
              name="${pair%%=*}"
              value="${pair#*=}"
              case "$name" in
                trace_weight)
                  KNOB_ARGS+=(--trace-weight "$value")
                  ;;
                topo_weight)
                  KNOB_ARGS+=(--topo-weight "$value")
                  ;;
                topo_discount)
                  KNOB_ARGS+=(--topo-discount "$value")
                  ;;
                topo_scope)
                  case "$value" in
                    all|external|caller) KNOB_ARGS+=(--topo-discount-scope "$value") ;;
                    *) echo "::error::ranking_knobs: topo_scope takes all, external or caller, got '$value'"; exit 1 ;;
                  esac
                  ;;
                topo_discount_gate)
                  case "$value" in
                    0|0.25|0.5|0.75|1) KNOB_ARGS+=(--topo-discount-gate "$value") ;;
                    *) echo "::error::ranking_knobs: topo_discount_gate takes 0, 0.25, 0.5, 0.75 or 1, got '$value'"; exit 1 ;;
                  esac
                  ;;
                # The deduction's CLOSURE, the fourth name of the same family and the first of them that is a
                # WORD rather than a number. Refused here as well as in the parser, so a dispatch cannot label a
                # `max` run `mean`.
                topo_closure)
                  case "$value" in
                    max|sum) KNOB_ARGS+=(--topo-closure "$value") ;;
                    *) echo "::error::ranking_knobs: topo_closure takes max or sum, got '$value'"; exit 1 ;;
                  esac
                  ;;
                # The SET the ranking covers — not a member of the deduction family: the filter applies at every
                # weight, so it is refused by its own vocabulary rather than inherited from a neighbour's.
                pool_admission)
                  case "$value" in
                    positive|graph) KNOB_ARGS+=(--pool-admission "$value") ;;
                    *) echo "::error::ranking_knobs: pool_admission takes positive or graph, got '$value'"; exit 1 ;;
                  esac
                  ;;
                collision_weight)
                  KNOB_ARGS+=(--collision-weight "$value")
                  ;;
                prism_weight)
                  KNOB_ARGS+=(--prism-weight "$value")
                  ;;
                prism_pooling)
                  KNOB_ARGS+=(--prism-pooling "$value")
                  ;;
                collapse_discount)
                  KNOB_ARGS+=(--collapse-discount "$value")
                  ;;
                # The anomaly composition. Four names rather than one `anomaly_knobs` list because this
                # block already IS a name=value parser, and the RCAEval half needed a second input only
                # because its 25-input budget was full. Measured on the golden half at
                # anomaly_breadth_weight=0.05: six of nine cells up, three unchanged, none down, +11 cases.
                anomaly_trend_weight)
                  KNOB_ARGS+=(--anomaly-trend-weight "$value")
                  ;;
                anomaly_burst_weight)
                  KNOB_ARGS+=(--anomaly-burst-weight "$value")
                  ;;
                anomaly_cv_weight)
                  KNOB_ARGS+=(--anomaly-cv-weight "$value")
                  ;;
                anomaly_breadth_weight)
                  KNOB_ARGS+=(--anomaly-breadth-weight "$value")
                  ;;
                anomaly_breadth_gate)
                  KNOB_ARGS+=(--anomaly-breadth-gate "$value")
                  ;;
                # The self-time term. Not a coefficient of the composition but a RANKING weight, and it
                # travels in this block for the same reason the composition does: the RCAEval half's
                # 25-input budget is full, so a term whose two halves must be measurable together needs a
                # channel on each side, and this block is the FSE'26 side's.
                self_time_weight)
                  KNOB_ARGS+=(--self-time-weight "$value")
                  ;;
                victim_weight)
                  KNOB_ARGS+=(--victim-weight "$value")
                  ;;
                # The BASE term's coefficient — the one weight the formula used to carry as a literal, and
                # therefore the one no arm could state. It ships at 1; 0 is its ablation.
                self_anomaly_weight)
                  KNOB_ARGS+=(--self-anomaly-weight "$value")
                  ;;
                dual_family_weight)
                  KNOB_ARGS+=(--dual-family-weight "$value")
                  ;;
                # The pod-state term: a pod's lifecycle transition across the injection boundary. It ships at
                # 0 and is the one reading the level guards cannot take, so the arm is stated here rather than
                # left to the default.
                pod_state_weight)
                  KNOB_ARGS+=(--pod-state-weight "$value")
                  ;;
                dual_family_gate)
                  KNOB_ARGS+=(--dual-family-gate "$value")
                  ;;
                dual_family_gate_mode)
                  KNOB_ARGS+=(--dual-family-gate-mode "$value")
                  ;;
                trace_skips_leader)
                  case "$value" in
                    1) KNOB_ARGS+=(--trace-skips-leader) ;;
                    0) KNOB_ARGS+=(--no-trace-skips-leader) ;;
                    *) echo "::error::ranking_knobs: trace_skips_leader takes 1 or 0, got '$value'"; exit 1 ;;
                  esac
                  ;;
                drop_deviation)
                  KNOB_ARGS+=(--drop-deviation-mode "$value")
                  ;;
                baseline_anchor)
                  KNOB_ARGS+=(--baseline-anchor "$value")
                  ;;
                # A GUARD rather than a weight, and it takes 1/0 like the two suppression switches above.
                zero_baseline_latency)
                  if [ "$value" = "1" ]; then
                    KNOB_ARGS+=(--suppress-zero-baseline-latency)
                  elif [ "$value" = "0" ]; then
                    KNOB_ARGS+=(--no-suppress-zero-baseline-latency)
                  else
                    echo "::error::ranking_knobs: zero_baseline_latency takes 1 or 0, got '$value'"
                    exit 1
                  fi
                  ;;
                cap_trend_bonus)
                  if [ "$value" = "1" ]; then
                    KNOB_ARGS+=(--cap-trend-bonus-at-deviation)
                  elif [ "$value" = "0" ]; then
                    KNOB_ARGS+=(--no-cap-trend-bonus-at-deviation)
                  else
                    echo "::error::ranking_knobs: cap_trend_bonus takes 1 or 0, got '$value'"
                    exit 1
                  fi
                  ;;
                suppress_idle_transients)
                  if [ "$value" = "1" ]; then
                    KNOB_ARGS+=(--suppress-idle-transients)
                  elif [ "$value" = "0" ]; then
                    KNOB_ARGS+=(--no-suppress-idle-transients)
                  else
                    echo "::error::ranking_knobs: suppress_idle_transients takes 1 or 0, got '$value'"
                    exit 1
                  fi
                  ;;
                suppress_near_zero_baseline_rise)
                  if [ "$value" = "1" ]; then
                    KNOB_ARGS+=(--suppress-near-zero-baseline-rise)
                  elif [ "$value" = "0" ]; then
                    KNOB_ARGS+=(--no-suppress-near-zero-baseline-rise)
                  else
                    echo "::error::ranking_knobs: suppress_near_zero_baseline_rise takes 1 or 0, got '$value'"
                    exit 1
                  fi
                  ;;
                # The guard's QUESTION. Its reach into this half was recorded as IMPOSSIBLE by the
                # dispatch-surface census - "that corpus carries no injection boundary" - and that sentence
                # was never measured: the loader rebuilds every series' timestamps and forwards the case's
                # own `injectTimeMs`, which are the statistic's two inputs. Routed here so the claim is
                # settled by a run.
                #
                # FORWARDED, not resolved. This branch used to carry its own copy of the vocabulary and the
                # copy was one member behind the engine's table: the conjunction landed in
                # `TRANSIENT_GUARD_TESTS` and this half refused it with a list that did not contain it, so the
                # nine-cell/FSE'26 read the arm owed could not be dispatched. A value the engine does not know
                # is refused by the CLI, against that table, with that table's own words — one owner, and the
                # owner is the union.
                log_normalisation)
                  # The log signal's SCALE, the one axis of that term a dispatch could not state: `max` divides by
                  # the case's largest admitted count (the shipped rule), `saturating` by a fixed volume, `share`
                  # by the case's total admitted count (the flood read as a distribution). Refused rather than
                  # defaulted on a bad value, because the arms are a MEASURED comparison and a typo that silently
                  # ran `max` would report the shipped number as the arm's reading.
                  case "$value" in
                    max|saturating|share) KNOB_ARGS+=(--log-normalisation "$value") ;;
                    *) echo "::error::ranking_knobs: log_normalisation takes max, saturating or share, got '$value'"; exit 1 ;;
                  esac
                  ;;
                transient_guard_test)
                  KNOB_ARGS+=(--transient-guard-test "$value")
                  ;;
                *)
                  echo "::error::ranking_knobs: unknown name '$name'"
                  exit 1
                  ;;
              esac
            done
          fi
          pnpm exec tsx benchmarks/src/run-fse26.ts \
            --data-dir "$HOME/rcabench/json" \
            "${LOG_WEIGHT_ARG[@]}" \
            "${LOG_MODE_ARG[@]}" \
            "${RANK_NORM_ARG[@]}" \
            "${DROP_METRICS_ARG[@]}" \
            "${EVENT_EXTRA_ARG[@]}" \
            "${FAILED_EDGE_ARG[@]}" \
            "${FAILED_EDGE_MODE_ARG[@]}" \
            "${FAILED_EDGE_MIN_ARG[@]}" \
            "${LAT_ARG[@]}" \
            "${LAT_FLOOR_ARG[@]}" \
            "${POOL_ARG[@]}" \
            "${STABILITY_ARG[@]}" \
            "${TEMPORAL_ARG[@]}" \
            "${ONSET_SHAPE_ARG[@]}" \
            "${KNOB_ARGS[@]}" \
            "${RISE_CEILING_ARG[@]}" \
            "${FLEET_BASELINE_ARG[@]}" \
            "${MAX_CASES_ARG[@]}" \
            "${DIAGNOSE_ARG[@]}" \
            "${DIAGNOSE_LIMIT_ARG[@]}" \
            "${DIAGNOSE_DECIMALS_ARG[@]}" \
            "${TERMS_ARG[@]}" \
            --per-case-out fse26-per-case.ndjson \
            --output fse26-results.json 2>&1 | tee fse26-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fse26-results
          path: |
            fse26-results.txt
            fse26-results.json
            fse26-per-case.ndjson
            fse26-terms.ndjson
            manifest.json
          if-no-files-found: warn
