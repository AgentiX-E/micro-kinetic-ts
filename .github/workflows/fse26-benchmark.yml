name: Benchmark — FSE'26 RCABench

on:
  workflow_dispatch:
    inputs:
      shard_tag:
        description: 'rcabench-data release tag holding the shards (explicit; never `latest`)'
        required: false
        default: 'rcabench-full'
      categories:
        description: 'Comma-separated fault categories to download (empty = all 7)'
        required: false
        default: ''
      max_cases:
        description: 'Number of datapacks to evaluate (0 = all downloaded)'
        required: false
        default: '0'
      log_weight:
        description: 'Log-signal weight (production default 1.0)'
        required: false
        default: '1.0'
      log_mode:
        description: 'Log-signal scoring mode (count = logic-exception, logicHttp = logic + framework HTTP, logicHttpJoint = logic + topology-gated framework HTTP, logicHttpDominant = logic + concentration-gated framework HTTP, all = every error)'
        required: false
        default: 'count'
      diagnose:
        description: 'Comma-separated fault types to dump a per-service signal diagnostic for (empty = none)'
        required: false
        default: ''
      diagnose_limit:
        description: 'Max diagnostic dumps per matching fault type (0 = unlimited)'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # ── Download pre-built per-category shards from rcabench-data ──
      #   The converted case.json output is pre-split into 7 fault-category
      #   shards and hosted as Release assets on AgentiX-E/rcabench-data, so
      #   the benchmark no longer downloads the 13.4 GB archive or re-runs the
      #   Parquet conversion.
      #
      #   The tag is explicit, never `releases/latest`. Re-uploading assets with
      #   `gh release upload --clobber` does not refresh a release's
      #   `published_at`, so `latest` keeps pointing at whichever release was
      #   *created* most recently and silently serves a superseded set. That is
      #   not hypothetical: `latest` resolved to `rcabench-full-v2`, whose assets
      #   predate the label fan-out fix, while the rebuilt shards sat on
      #   `rcabench-full` -- and a full run was dispatched against the stale set.
      - name: Download shards from rcabench-data
        env:
          SHARD_TAG: ${{ inputs.shard_tag }}
        run: |
          mkdir -p "$HOME/rcabench/json"
          BASE="https://github.com/AgentiX-E/rcabench-data/releases/download/$SHARD_TAG"
          curl -L --fail --retry 10 --retry-all-errors \
            -o "$HOME/rcabench/manifest.json" "$BASE/manifest.json"
          if [ -n "${{ inputs.categories }}" ]; then
            CATS=$(echo "${{ inputs.categories }}" | tr ',' ' ')
          else
            CATS=$(python3 -c "import json; print(' '.join(s['category'] for s in json.load(open('$HOME/rcabench/manifest.json'))['shards']))")
          fi
          for cat in $CATS; do
            curl -L --fail --retry 10 --retry-all-errors \
              -o "$HOME/rcabench/rcabench-$cat.tar.gz" \
              "$BASE/rcabench-$cat.tar.gz"
            tar xzf "$HOME/rcabench/rcabench-$cat.tar.gz" -C "$HOME/rcabench/json"
          done
          echo "Shard tag: $SHARD_TAG"
          echo "Downloaded categories: $CATS"
          echo "case.json count: $(find "$HOME/rcabench/json" -name case.json | wc -l)"
          df -h "$HOME"
          echo "RCABENCH_CATEGORIES=$(echo $CATS | tr ' ' ',')" >> "$GITHUB_ENV"

      # ── Provenance gate ──
      #   A cache is consumed without re-conversion, so nothing in the data
      #   reveals which converter produced it: a set built from an older
      #   revision is byte-indistinguishable from a current one and publishes a
      #   wrong score with no error. Refuse to run unless the manifest's
      #   converter digest matches this checkout, and each downloaded shard
      #   matches the size + sha256 the manifest recorded. Copy the manifest
      #   into the run artifact so every published number is traceable to the
      #   exact cache it came from.
      - name: Verify cache provenance
        run: |
          python3 scripts/fse26_provenance.py \
            --root scripts \
            --manifest "$HOME/rcabench/manifest.json" \
            --shard-dir "$HOME/rcabench" \
            --categories "$RCABENCH_CATEGORIES"
          cp "$HOME/rcabench/manifest.json" manifest.json

      # ── TypeScript engine ──
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run FSE'26 benchmark
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          set -o pipefail
          MAX_CASES_ARG=()
          if [ "${{ inputs.max_cases }}" != "0" ]; then
            MAX_CASES_ARG=(--max-cases "${{ inputs.max_cases }}")
          fi
          DIAGNOSE_ARG=()
          if [ -n "${{ inputs.diagnose }}" ]; then
            DIAGNOSE_ARG=(--diagnose "${{ inputs.diagnose }}" --diagnose-limit "${{ inputs.diagnose_limit }}")
          fi
          pnpm exec tsx benchmarks/src/run-fse26.ts \
            --data-dir "$HOME/rcabench/json" \
            --log-weight "${{ inputs.log_weight }}" \
            --log-mode "${{ inputs.log_mode }}" \
            "${MAX_CASES_ARG[@]}" \
            "${DIAGNOSE_ARG[@]}" \
            --output fse26-results.json 2>&1 | tee fse26-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fse26-results
          path: |
            fse26-results.txt
            fse26-results.json
            manifest.json
