name: Cache Benchmark Datasets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-datasets.yml'
  schedule:
    - cron: '0 2 * * 0'  # Weekly refresh (Sunday 2am UTC)

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore cached datasets
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ~/RCAEval-data
          key: RCAEval-datasets-v2-pq
          restore-keys: |
            RCAEval-datasets-

      - name: Download datasets from Hugging Face (cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          pip install huggingface_hub
          mkdir -p ~/RCAEval-data
          python3 -c "
          from huggingface_hub import snapshot_download
          import os, time

          data_dir = os.path.expanduser('~/RCAEval-data')
          print(f'Downloading RCAEval datasets to {data_dir}...')
          max_retries = 5
          for attempt in range(1, max_retries + 1):
              try:
                  snapshot_download(
                      'phamquiluan/RCAEval',
                      repo_type='dataset',
                      local_dir=data_dir,
                      local_dir_use_symlinks=False,
                      resume_download=True,
                      max_workers=2,  # reduce concurrency to avoid 429
                  )
                  print('Download complete.')
                  break
              except Exception as e:
                  if attempt < max_retries and '429' in str(e):
                      wait = 2 ** attempt * 15  # 30s, 60s, 120s, 240s
                      print(f'Rate limited (429), retrying in {wait}s (attempt {attempt}/{max_retries})...')
                      time.sleep(wait)
                  else:
                      raise
          "

      - name: Verify cache
        run: |
          echo "Cached files: $(find ~/RCAEval-data -type f 2>/dev/null | wc -l)"
          echo "Cache size: $(du -sh ~/RCAEval-data 2>/dev/null | cut -f1)"
