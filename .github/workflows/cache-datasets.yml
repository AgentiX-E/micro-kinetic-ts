name: Cache Benchmark Datasets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-datasets.yml'
  schedule:
    - cron: '0 2 * * 0'  # Weekly refresh (Sunday 2am UTC)

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache key — dataset version identifier
        id: cache-key
        run: |
          # Bump this version when datasets are updated
          echo "DATASET_VERSION=v1" >> $GITHUB_ENV
          echo "KEY=RCAEval-datasets-${{ env.DATASET_VERSION }}" >> $GITHUB_ENV

      - name: Restore cached datasets
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ~/RCAEval-data
          key: ${{ env.KEY }}
          restore-keys: |
            RCAEval-datasets-

      - name: Download datasets (cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          pip install RCAEval
          mkdir -p ~/RCAEval-data
          python3 -c "
          import os, sys
          os.environ['RCAEVAL_DATA_DIR'] = os.path.expanduser('~/RCAEval-data')
          from RCAEval.utility import download_re1_dataset, download_re2_dataset, download_re3_dataset
          print('Downloading RE1 (375 cases, ~390MB)...')
          download_re1_dataset()
          print('Downloading RE2 (270 cases, ~4.2GB)...')
          download_re2_dataset()
          print('Downloading RE3 (90 cases, ~534MB)...')
          download_re3_dataset()
          print('All datasets cached at ~/RCAEval-data')
          "

      - name: Verify cache
        run: |
          echo "Cached cases: $(find ~/RCAEval-data -name 'inject_time.txt' 2>/dev/null | wc -l)"
          echo "Cache size: $(du -sh ~/RCAEval-data 2>/dev/null | cut -f1)"

      - name: Report status
        if: always()
        run: |
          echo "${{ job.status }}" > .cache-status
          git config user.email "ci@agentix-e.dev"
          git config user.name "CI Bot"
          git add .cache-status
          git diff --staged --quiet || git commit -m "ci: cache-datasets ${{ job.status }}"
          git push
