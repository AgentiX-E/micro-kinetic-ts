name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: CI=false pnpm build
      - run: pnpm typecheck

  # Every package that carries a coverage threshold must appear here, or the threshold is a
  # comment: `packages/*/vitest.config.ts` asks for 95% on all four dimensions, and a package
  # nobody runs is a package whose 80% nobody sees. The matrix assumes `packages/<name>/coverage/`;
  # `benchmarks/` is gated by `benchmark-tests` below for that reason.
  test:
    needs: typecheck
    strategy:
      matrix:
        package:
          - core
          - tree
          - cutting
          - noise
          - scaling
          - wave
          - kinetic
          - causal
          - ai
          - optimize
          - storage-fs
          - storage-browser
          - storage-remote
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Determine nx project name
        id: pkg
        run: |
          if [ "${{ matrix.package }}" = "kinetic" ]; then
            echo "name=@agentix-e/micro-kinetic" >> $GITHUB_OUTPUT
          else
            echo "name=@agentix-e/micro-kinetic-${{ matrix.package }}" >> $GITHUB_OUTPUT
          fi
      # The coverage request is a TARGET whose script body holds `--coverage`, not an argument
      # appended after `--`. Measured 2026-09-25: the appended form travels nx -> package manager ->
      # script, and whether it arrives is a property of the package manager. Where it does not
      # arrive (this repository's development environment uses a package-manager shim whose last
      # line is `exec sh -c "$cmd"`), the command runs every suite, exits 0 and measures NOTHING.
      # A target has no layer to lose it in.
      - run: pnpm nx run ${{ steps.pkg.outputs.name }}:test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  benchmark-diff:
    if: github.event_name == 'pull_request'
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run baseline benchmark
        run: |
          git checkout ${{ github.base_ref }}
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsx benchmarks/src/run-all.ts --output baseline.json --cases 30
      - name: Run current benchmark
        run: |
          git checkout ${{ github.head_ref }}
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsx benchmarks/src/run-all.ts --output current.json --cases 30
      - name: Comment benchmark diff
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: current.json
          external-data-json-path: baseline.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: 105%

  # The benchmark harness decides every number this project publishes, and its
  # unit suites -- the topology builder and the semantic topology enhancer -- are
  # gated on coverage like any package. A separate job rather than a matrix entry
  # because the matrix assumes `packages/<name>/coverage/`, and `benchmarks/` is
  # not under `packages/`.
  #
  # `__tests__/integration/**` is excluded by `benchmarks/vitest.config.ts`: it
  # calls the real Zhipu embedding API, so it cannot gate anything.
  benchmark-tests:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @agentix-e/micro-kinetic-benchmarks:test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-benchmarks
          path: benchmarks/coverage/

  # The Parquet → JSON bridge and the sharder decide every published benchmark
  # number, and they are plain Python: gate them on their own unit tests, which
  # run against synthetic Parquet/JSON in about a second and need no download.
  # Branch coverage is enforced, not just line coverage.
  #
  # CORRECTED 2026-09-20: this comment was TRUE of the sharder and FALSE of the
  # bridge, which the `--omit` below excluded — the file that produces
  # `~/RCAEval-json`, which every RCAEval benchmark including the golden is read
  # from. The omit list turned out to be exactly the three filenames containing a
  # hyphen, i.e. a name `import` cannot address; `evaluate-openrca.py` is 264
  # lines of pure standard library and was excluded by four characters of its
  # name. The bridge is now measured at 100% (and its reader, pandas, is
  # installed by the line above). The two that remain out are a RECORDED
  # decision, checked in both directions by `scripts/test_coverage_omissions.py`.
  converter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-fse26.txt
            scripts/requirements-fse26-dev.txt
            scripts/requirements-rcaeval.txt
      - name: Install converter dependencies
        run: python -m pip install -r scripts/requirements-fse26-dev.txt
      - name: Run converter + sharder tests with branch coverage
        working-directory: scripts
        run: |
          coverage run --branch --source=. \
            --omit='test_*,download-and-benchmark.py,evaluate-openrca.py' \
            -m unittest discover -s . -p 'test_*.py'
          coverage report --fail-under=95 --precision=2
