name: Dump RE3 Metric Shapes

# One-off diagnostic: dump the full metric-series shapes for a target system's
# RE3 cases (head/tail median + high-level fraction + crash-gate trigger), so the
# crash-victim baseline gate can be tuned against the REAL data rather than an
# extrapolated shape. Dispatched manually; uploads a text artifact for readback.

on:
  workflow_dispatch:
    inputs:
      system:
        description: 'System code (ob | ss | tt)'
        required: true
        default: 'ss'
        type: string
      gt_only:
        description: 'Dump only the ground-truth service metrics (true | false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Dump RE3 metric shapes
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          EXTRA=""
          if [ "${{ inputs.gt_only }}" = "true" ]; then EXTRA="--gt-only"; fi
          pnpm exec tsx scripts/dump-re3-metrics.ts \
            --data-dir ~/RCAEval-json \
            --system "${{ inputs.system }}" \
            --suite re3 $EXTRA 2>&1 | tee dump-re3-metrics.txt
      - name: Upload dump artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump-re3-metrics
          path: dump-re3-metrics.txt
