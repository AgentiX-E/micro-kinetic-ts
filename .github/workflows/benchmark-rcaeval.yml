name: Benchmark — RCAEval Full Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-rcaeval.yml'
      - 'scripts/convert-parquet-to-json.py'
      - 'benchmarks/src/**'
  workflow_run:
    workflows: [Cache Benchmark Datasets]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Synthetic benchmark: fast, no external data needed ──
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run synthetic benchmark (175 cases)
        run: |
          pnpm exec tsx benchmarks/src/run-all.ts --cases 175 --output benchmark-results.json

      - name: Upload synthetic results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-results
          path: benchmark-results.json

  # ── RCAEval benchmark: requires cached datasets ──
  rcaeval:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore cached RCAEval JSON
        id: jsonCache
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEval-json-v2
          restore-keys: |
            RCAEval-json-

      - name: Restore cached RCAEval Parquet (fallback)
        if: steps.jsonCache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-data
          key: RCAEval-datasets-v2-pq
          restore-keys: |
            RCAEval-datasets-

      - name: Check data directory
        id: checkData
        run: |
          if [ -d ~/RCAEval-json ]; then
            JSON_COUNT=$(find ~/RCAEval-json -type d -mindepth 1 2>/dev/null | wc -l)
            echo "JSON case dirs: $JSON_COUNT"
          else
            echo "JSON cache not available"
            JSON_COUNT=0
          fi

          if [ -d ~/RCAEval-data ]; then
            PQ_COUNT=$(find ~/RCAEval-data -name '*.parquet' 2>/dev/null | wc -l)
            echo "Parquet files: $PQ_COUNT"
          else
            echo "Parquet cache not available"
            PQ_COUNT=0
          fi

          echo "json_count=$JSON_COUNT" >> $GITHUB_OUTPUT
          echo "pq_count=$PQ_COUNT" >> $GITHUB_OUTPUT

      - name: Convert Parquet to JSON (on-the-fly)
        if: steps.checkData.outputs.json_count == '0' && steps.checkData.outputs.pq_count != '0'
        run: |
          echo "JSON cache miss — converting Parquet to JSON..."
          pip install pandas pyarrow
          python3 scripts/convert-parquet-to-json.py

      - name: Run RCAEval benchmark
        if: steps.checkData.outputs.json_count != '0' || steps.checkData.outputs.pq_count != '0'
        run: |
          pnpm exec tsx benchmarks/src/run-rcaeval.ts 2>&1 | tee rcaeval-results.txt

      - name: Report data missing
        if: steps.checkData.outputs.json_count == '0' && steps.checkData.outputs.pq_count == '0'
        run: |
          echo "No RCAEval data available. Run 'Cache Benchmark Datasets' workflow first." > rcaeval-results.txt
          echo "::warning::RCAEval datasets not cached. Skipping real-dataset benchmark."

      - name: Upload RCAEval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-results
          path: |
            rcaeval-results.txt

  # ── Dashboard: combine results and deploy ──
  dashboard:
    needs: [synthetic, rcaeval]
    if: always() && (needs.synthetic.result == 'success' || needs.synthetic.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download synthetic results
        uses: actions/download-artifact@v4
        with:
          name: synthetic-results
          path: artifacts/

      - name: Download RCAEval results
        uses: actions/download-artifact@v4
        with:
          name: rcaeval-results
          path: artifacts/
        continue-on-error: true

      - name: Generate HTML dashboard
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone

          synthetic_file = 'artifacts/benchmark-results.json'
          rcaeval_file = 'artifacts/rcaeval-results.txt'

          synthetic = json.load(open(synthetic_file)) if os.path.exists(synthetic_file) else [{'name':'N/A','value':'Data not found','unit':''}]
          rcaeval_raw = open(rcaeval_file).read() if os.path.exists(rcaeval_file) else 'Not available (data cache miss)'

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          sha = os.environ.get('GITHUB_SHA', 'unknown')[:8]
          run_id = os.environ.get('GITHUB_RUN_ID', '?')

          synthetic_rows = '\n'.join([
              f'<tr><td>{m[\"name\"]}</td><td>{m[\"value\"]}</td><td>{m[\"unit\"]}</td></tr>'
              for m in synthetic
          ])

          html = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
          <meta charset=\"UTF-8\">
          <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
          <title>Micro-Kinetic Benchmark Dashboard</title>
          <style>
            * {{ margin: 0; padding: 0; box-sizing: border-box; }}
            body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 20px; }}
            .container {{ max-width: 1400px; margin: 0 auto; }}
            h1 {{ color: #58a6ff; font-size: 2em; border-bottom: 2px solid #30363d; padding-bottom: 12px; margin-bottom: 20px; }}
            h2 {{ color: #f0883e; margin: 30px 0 15px; font-size: 1.5em; }}
            .meta {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px; font-size: 0.9em; }}
            .meta span {{ color: #8b949e; }}
            .meta strong {{ color: #58a6ff; }}
            table {{ width: 100%; border-collapse: collapse; margin: 10px 0 20px; background: #161b22; border-radius: 8px; overflow: hidden; }}
            th, td {{ padding: 10px 14px; text-align: left; border: 1px solid #21262d; }}
            th {{ background: #1f2937; color: #58a6ff; font-weight: 600; }}
            tr:hover {{ background: #1c2129; }}
            pre {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; overflow-x: auto; font-size: 0.85em; }}
          </style>
          </head>
          <body>
          <div class=\"container\">
          <h1> Micro-Kinetic Benchmark Dashboard</h1>
          <div class=\"meta\">
            <strong>Commit:</strong> {sha} &nbsp;|&nbsp;
            <strong>Run:</strong> <a href=\"https://github.com/AgentiX-E/micro-kinetic-ts/actions/runs/{run_id}\" style=\"color:#58a6ff\">#{run_id}</a> &nbsp;|&nbsp;
            <strong>Time:</strong> {now}
          </div>

          <h2> Synthetic Benchmark (175 cases, 6 fault types)</h2>
          <table>
            <tr><th>Metric</th><th>Value</th><th>Unit</th></tr>
            {synthetic_rows}
          </table>

          <h2> RCAEval Real Dataset</h2>
          <pre>{rcaeval_raw}</pre>

          <p style=\"text-align:center;color:#8b949e;margin-top:40px;font-size:0.8em\">
            Powered by AgentiX-E Micro-Kinetic &middot; Deng Yu Kinetic Theory &middot; Auto-generated by CI
          </p>
          </div>
          </body>
          </html>'''

          with open('index.html', 'w') as f:
              f.write(html)
          print('Dashboard generated: index.html')
          "

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dashboard
          path: |
            index.html
            artifacts/benchmark-results.json
            artifacts/rcaeval-results.txt

      - name: Post summary
        if: always()
        run: |
          echo '## Micro-Kinetic Synthetic Benchmark' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/benchmark-results.json ]; then
            cat artifacts/benchmark-results.json >> $GITHUB_STEP_SUMMARY
          else
            echo 'No synthetic results available' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## RCAEval Real Dataset Benchmark' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/rcaeval-results.txt ]; then
            cat artifacts/rcaeval-results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'No RCAEval results (data cache miss)' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          destination_dir: benchmark
