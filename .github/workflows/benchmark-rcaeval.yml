name: Benchmark — RCAEval Full Dataset

on:
  workflow_dispatch:
    inputs:
      stability_weight:
        description: "Decisive-stability weight for the ranking (empty = the runner default, which is the SHIPPED 0.007352, the midpoint of the criterion intersection). Set it to the REJECTED FSE'26 window midpoint 0.030170 to see why that point is rejected: it moved four of the nine cells, two of them by ~41pp"
        required: false
        default: ''
        type: string
      log_weight:
        description: "Weight on the log signal (empty = the runner default, which is 1). Added so the golden half of the kill criterion is measurable by DISPATCH: until it existed, a candidate whose knob only the FSE'26 workflow could pass had an undecidable other half, which is why the REJECTED temporal candidate is recorded with `golden: 'unmeasured'`"
        required: false
        default: ''
        type: string
      temporal_weight:
        description: "Weight of the injection-anchored temporal prior (empty = the runner default, which is 0). The runner has accepted this flag all along and no dispatch could reach it — a pin whose replacement is unreachable is still a pin"
        required: false
        default: ''
        type: string
      onset_shape:
        description: "Shape the temporal prior reads the onset delays in (empty = the runner default, earliness). A weight is a claim about a SHAPE, so the two travel together or neither is a configuration"
        required: false
        default: ''
        type: string
      no_rank_normalization:
        description: "Set to anything non-empty to DISABLE rank normalisation (empty = the runner default, which is ON). Spelled as the negation because that is the only pole the FSE'26 parser exposes, so the same value means the same thing in both workflows"
        required: false
        default: ''
        type: string
      diagnose_dump:
        description: "Write the FSE'26 signal diagnostic for every diagnosed case, one file per invocation, uploaded as an artifact. This is what lets the weight solver, the family screen and the decisive-stability screen run on THIS benchmark offline, instead of costing a dispatch per weight (empty = off)"
        required: false
        default: ''
        type: string
      diagnose_decimals:
        description: "Decimals per service field in the diagnostic dump — the precision of the ARTIFACT rather than of the run. Leave it empty for the runner default (3), which is the artifact every dump written so far is. Raise it only to test a claim about the reader's error bar: every block header states this number, so a reader takes its resolution box from the file itself, and a finer artifact re-opens windows the three-decimal render could not decide. A value the renderer cannot express falls back to the default instead of crashing the run (empty = the runner default)"
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/benchmark-rcaeval.yml'
      - 'scripts/convert-parquet-to-json.py'
      - 'benchmarks/src/**'
      # The ENGINE. `packages/tree` holds the shipped score, the weights and the pruner, so it is the
      # only tree that can move the golden 9-cell — and until this entry existed, a push touching
      # nothing but `packages/.../src` triggered no benchmark at all. The kill criterion's second half
      # is a claim about a RUN; a criterion nothing runs is not a criterion. Guarded by
      # `benchmarks/__tests__/benchmark-rcaeval-trigger.test.ts`, which reads this list as text.
      - 'packages/*/src/**'
  workflow_run:
    workflows: [Cache Benchmark Datasets]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Synthetic: fast, no external data ──
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run synthetic benchmark (175 cases)
        run: |
          pnpm exec tsx benchmarks/src/run-all.ts --cases 175 --output benchmark-results.json
      - name: Run adaptive optimizer
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/optimize-all.ts 2>&1 | tee optimize-results.txt
      - name: Upload synthetic results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-results
          path: benchmark-results.json
      - name: Upload optimizer results
        uses: actions/upload-artifact@v4
        with:
          name: optimize-results
          path: optimize-results.txt

  # ── RCAEval: 3 parallel runners (RE1 / RE2 / RE3) ──
  rcaeval-re1:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        # `consume`: the artifact must exist AND must state this checkout's bridge. A miss fails here
        # rather than letting the battery run against an absent directory and report an empty result
        # as a measurement. The key, the path and the trust live in the action, which derives the key
        # from the bridge itself -- the constant this replaced named nothing, at seven sites in this
        # file alone, and its `restore-keys` prefix could never match it.
        uses: ./.github/actions/rcaeval-json
        with:
          mode: consume
      - name: Run RCAEval — RE1 only
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          STABILITY_ARG=()
          # `if`/`fi` rather than `[ -n ... ] &&`, because GitHub's bash runs with `-e`:
          # a bare failing test would abort the step before the benchmark ran.
          if [ -n "${{ inputs.stability_weight }}" ]; then
            STABILITY_ARG=(--stability-weight "${{ inputs.stability_weight }}")
          fi
          RANKING_ARG=()
          # The knobs BOTH runners accept, so a candidate on any of them can be measured on this
          # benchmark without moving a default to do it — the golden half of the kill criterion.
          # Every one is empty by default, so a PUSH passes no flag at all and the nine cells stay
          # byte-identical; the guard that keeps that true is the same one that reads the accepted
          # set out of each parser.
          if [ -n "${{ inputs.log_weight }}" ]; then
            RANKING_ARG+=(--log-weight "${{ inputs.log_weight }}")
          fi
          if [ -n "${{ inputs.temporal_weight }}" ]; then
            RANKING_ARG+=(--temporal-weight "${{ inputs.temporal_weight }}")
          fi
          if [ -n "${{ inputs.onset_shape }}" ]; then
            RANKING_ARG+=(--onset-shape "${{ inputs.onset_shape }}")
          fi
          if [ -n "${{ inputs.no_rank_normalization }}" ]; then
            RANKING_ARG+=(--no-rank-normalization)
          fi
          DIAGNOSE_ARG=()
          # One file per STEP, because the three RE3 invocations share a job: a single
          # path would leave only the last configuration's cases on disk, and a dump
          # that is silently one configuration is what the fidelity line cannot see.
          if [ -n "${{ inputs.diagnose_dump }}" ]; then
            DIAGNOSE_ARG=(--diagnose-dump rcaeval-diagnose-re1.txt)
            if [ -n "${{ inputs.diagnose_decimals }}" ]; then
              DIAGNOSE_ARG+=(--diagnose-decimals "${{ inputs.diagnose_decimals }}")
            fi
          fi
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re1 "${STABILITY_ARG[@]}" "${RANKING_ARG[@]}" "${DIAGNOSE_ARG[@]}" 2>&1 | tee rcaeval-re1-results.txt
      - name: Upload RE1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-re1-results
          path: |
            rcaeval-re1-results.txt
            rcaeval-diagnose-re1.txt
      - name: Run RCAEval — RE1 only (no inject_time)
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          STABILITY_ARG=()
          # `if`/`fi` rather than `[ -n ... ] &&`, because GitHub's bash runs with `-e`:
          # a bare failing test would abort the step before the benchmark ran.
          if [ -n "${{ inputs.stability_weight }}" ]; then
            STABILITY_ARG=(--stability-weight "${{ inputs.stability_weight }}")
          fi
          RANKING_ARG=()
          # The knobs BOTH runners accept, so a candidate on any of them can be measured on this
          # benchmark without moving a default to do it — the golden half of the kill criterion.
          # Every one is empty by default, so a PUSH passes no flag at all and the nine cells stay
          # byte-identical; the guard that keeps that true is the same one that reads the accepted
          # set out of each parser.
          if [ -n "${{ inputs.log_weight }}" ]; then
            RANKING_ARG+=(--log-weight "${{ inputs.log_weight }}")
          fi
          if [ -n "${{ inputs.temporal_weight }}" ]; then
            RANKING_ARG+=(--temporal-weight "${{ inputs.temporal_weight }}")
          fi
          if [ -n "${{ inputs.onset_shape }}" ]; then
            RANKING_ARG+=(--onset-shape "${{ inputs.onset_shape }}")
          fi
          if [ -n "${{ inputs.no_rank_normalization }}" ]; then
            RANKING_ARG+=(--no-rank-normalization)
          fi
          DIAGNOSE_ARG=()
          # One file per STEP, because the three RE3 invocations share a job: a single
          # path would leave only the last configuration's cases on disk, and a dump
          # that is silently one configuration is what the fidelity line cannot see.
          if [ -n "${{ inputs.diagnose_dump }}" ]; then
            DIAGNOSE_ARG=(--diagnose-dump rcaeval-diagnose-re1-noinject.txt)
            if [ -n "${{ inputs.diagnose_decimals }}" ]; then
              DIAGNOSE_ARG+=(--diagnose-decimals "${{ inputs.diagnose_decimals }}")
            fi
          fi
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re1 --no-inject-time "${STABILITY_ARG[@]}" "${RANKING_ARG[@]}" "${DIAGNOSE_ARG[@]}" 2>&1 | tee rcaeval-re1-noinject-results.txt
      - name: Upload RE1 no-inject results
        if: always()
        uses: actions/upload-artifact@v4
        with:
