name: Benchmark — RCAEval Full Dataset

on:
  workflow_dispatch:
    inputs:
      stability_weight:
        description: "Decisive-stability weight for the ranking (empty = the runner default, which is the SHIPPED 0.007352, the midpoint of the criterion intersection). Set it to the REJECTED FSE'26 window midpoint 0.030170 to see why that point is rejected: it moved four of the nine cells, two of them by ~41pp"
        required: false
        default: ''
        type: string
      log_weight:
        description: "Weight on the log signal (empty = the runner default, which is 1). Added so the golden half of the kill criterion is measurable by DISPATCH: until it existed, a candidate whose knob only the FSE'26 workflow could pass had an undecidable other half, which is why the REJECTED temporal candidate is recorded with `golden: 'unmeasured'`"
        required: false
        default: ''
        type: string
      log_signal_mode:
        description: "Log-signal scoring mode (empty = the runner default, which is the SHIPPED count, the mode every golden run so far was taken with). The vocabulary is the ENGINE's union: count = self-caused logic exceptions only, novelty = IDF-weighted, logicHttp = logic + framework HTTP, logicHttpJoint = logic + topology-gated framework HTTP, logicHttpDominant = logic + concentration-gated framework HTTP, all = every ERROR/FATAL line. Added because the runner accepted --log-signal-mode all along but parsed it against a hand-written two-member pair, so four of the six members — `all` among them — were silently replaced by count: a dispatch asking for `all` ran `count` and printed a confident number, and the `NetworkPartition`/`errLines` cell could not be measured on this half at all"
        required: false
        default: ''
        type: string
      temporal_weight:
        description: "Weight of the injection-anchored temporal prior (empty = the runner default, which is 0). The runner has accepted this flag all along and no dispatch could reach it — a pin whose replacement is unreachable is still a pin"
        required: false
        default: ''
        type: string
      onset_shape:
        description: "Shape the temporal prior reads the onset delays in (empty = the runner default, earliness). A weight is a claim about a SHAPE, so the two travel together or neither is a configuration"
        required: false
        default: ''
        type: string
      no_rank_normalization:
        description: "Set to anything non-empty to DISABLE rank normalisation (empty = the runner default, which is ON). Spelled as the negation because that is the only pole the FSE'26 parser exposes, so the same value means the same thing in both workflows"
        required: false
        default: ''
        type: string
      anomaly_normalize_threshold:
        description: "The node count at or above which rank normalisation runs at all (empty = the runner default, the SHIPPED 20). The flag above picks WHICH rescale; this picks WHETHER one runs, and it is therefore the axis's POPULATION: on this corpus 487 of the 735 cases are below the shipped count (OnlineBoutique and SockShop, ≤ 15 nodes) and 248 are at or above it (TrainTicket, 63–69), so the flag is not read on two thirds of the benchmark and the register's verdict about it has never been testable there. Set it to 0 to rescale every graph, or to 1 to include the few RE3 cases whose graph is larger than their cell-mates'"
        required: false
        default: ''
        type: string
      trace_weight:
        description: "Weight on the trace-activity term (empty = the runner default, which is 0 on every suite but RE3 — where this step's own pin sets 1 inside the guard below, so a dispatch that states this input still wins and no state states the flag twice). It is BINARY (exactly 0 or exactly 1, with no magnitude), and that scale is the finding: on rank-normalised TrainTicket the base term's adjacent-rank gap is 0.0083 at 68 nodes, so this term can override ~100 rank positions. A per-case read of the 159 reranking misses found it moving a deciding gap 6 times and pushing for the WRONG service on ALL SIX; the RE3 pin was established against a control that also had noInjectTime on, so dispatching trace_weight=0 here is the first UNCONFOUNDED test of it. See docs/rank-collapse-falsified.md"
        required: false
        default: ''
        type: string
      topo_weight:
        description: "Weight on the topology source-likelihood term (empty = the runner default, the SHIPPED 0 = disabled). Measured at −42.4 / −37.8 / −3.1 cases when enabled, i.e. NEGATIVE on every suite, which is why it ships off — and until this input existed the golden half could not re-test that, so the register's row rested on one measurement that no dispatch could reproduce"
        required: false
        default: ''
        type: string
      collision_weight:
        description: "Weight on the collision-energy term — the Deng-Yu-inspired Q(f,f) aggregation (empty = the runner default, the SHIPPED 0 = disabled). The cause family it reads was measured at 19084 instances ALL `WEIGHT_ZERO`, so its contribution to every miss in the published configuration is exactly 0.0000; this input is what lets a dispatch make it non-zero and read what it does"
        required: false
        default: ''
        type: string
      prism_weight:
        description: "Weight on the PRISM-derived term (empty = the runner default, the SHIPPED 0 = disabled). PRISM is the competitor this project leads by +10.8pp on the published convention, and `prismWeight=0` is a recorded never-revert fact — so a non-zero dispatch here re-tests a recorded rejection instead of leaving it as one measurement on one instrument"
        required: false
        default: ''
        type: string
      prism_pooling:
        description: "The COMBINATION function the prism term pools its per-service contributions with (`additive` = the runner default and the shipped primitive). The pooling was implemented in the primitive and selectable by the standalone evaluator, while no ENGINE configuration could name it until the call site was repaired — and this input is the second half of that repair, because an option a dispatch cannot state is the same hole one level up"
        required: false
        default: ''
        type: string
      collapse_discount:
        description: "The discount applied to a DROP relative to an equivalent rise (empty = the runner default, the SHIPPED 0 = symmetric). It is a MASK rather than a compression — it drops only discounts strictly between 0 and the value — so a masked setting and an inert one can print the same Δ, and only a dispatch can separate them"
        required: false
        default: ''
        type: string
      suppress_idle_transients:
        description: "Set to anything non-empty to extend the transient-spike guard to IDLE-START transients: a metric that starts at ~0, has a transient excursion, and settles at a NON-zero tail (empty = the runner default, false = the shipped scoring). The term's own docblock names its target — the near-zero-baseline spike that outranks a genuine permanent drop on ts-route-service in RE3 — and a per-case read of the misses locates five of the ten cases a binary weight-1.0 term decided against the truth in exactly that service family"
        required: false
        default: ''
        type: string
      suppress_near_zero_baseline_rise:
        description: "Set to anything non-empty to suppress a rise measured against a near-zero baseline (empty = the runner default, false = the shipped scoring). The companion of the switch above and the same shape of hole: an engine option that ships off, is named on every configuration line, and that no dispatch could turn on"
        required: false
        default: ''
        type: string
      suppress_demand_metrics:
        description: "Set to 0 to let a DEMAND metric (workload — how much work a service was HANDED) be a node's decisive evidence again (empty = the runner default, which is the SHIPPED true). The DEFAULT is the recent change and the value worth typing is the ABLATION, which is why this input is inverted relative to its two neighbours: it ships ON, on the measurement docs/rcaeval-local-harness.md carries — the family is decisive for 4.0% of ground truths against 12.5% of bystanders, and removing it takes RE1-OnlineBoutique 100/125 to 103/125 with zero regressed fault types"
        required: false
        default: ''
        type: string
      lat_weight:
        description: "Weight on the per-edge latency term (empty = the runner default, which is the SHIPPED 0.561495, the largest weight in the ranking). This flag existed on the FSE'26 runner all along and had NO arm on this one, so the golden half of the kill criterion could not move the term at all — while every artifact's configuration line printed the value as though a dispatch had chosen it. A candidate measurable on one instrument and judged on another has an undecidable other half"
        required: false
        default: ''
        type: string
      lat_min_rise:
        description: "Floor on the pre/post rise the latency term needs before it reads an edge (empty = the runner default, which is the SHIPPED 10.3). The floor is a MASK and not a compression: it drops only rises strictly between 1 and 10.3, so a masked channel and an inert one print the same Δ+0.0 and only a run against a SUPPLIED corpus can separate them. Set it to 1 to measure the channel with the mask off. The floor's domain is floored at 1, so a value below it falls back to the shipped one"
        required: false
        default: ''
        type: string
      pool_penalty:
        description: "Weight of the pool-metric penalty (empty = the runner default, which is the SHIPPED 0.0679, measured as +6 cases). Added with the other two that the artifact named before any command line could set them: a value that is printed, forwarded to the engine and unreachable by dispatch makes the configuration line assert a configuration nobody can state. Set it to 0 for the ablation"
        required: false
        default: ''
        type: string
      failed_edge_weight:
        description: "Weight on the failed-edge DIRECTION term (empty = the runner default, which is the SHIPPED 3 since iteration 125, worth +41 cases on FSE'26 with zero regressed fault types). The term has a MEASURED gate in the engine — +42 on FSE'26 with zero regressed fault types, `admitsFailedEdgeTerm`, ported in iteration 123 — and until this input existed NO dispatch could state a weight for the golden half of the kill criterion, so the arm's second condition was undecidable rather than unmet. READ IT BESIDE `latency_view`: the gate's second half is the rank-1 service's raw latency rise, taken from `edgeLatency`, and on the SHIPPED view that array is empty on every RCAEval cell — so a weight above zero on that view buys a term that CANNOT fire and its cells are identical for a reason that is not safety. The runner prints `direction-gate[<view>]` beside the latency census to say which of the two a run is, and a weight only means something together with `latency_view=whole-file`"
        required: false
        default: ''
        type: string
      latency_view:
        description: "Which view of `edgeLatency` the corpus carries — whole-file (empty = the runner default since iteration 129, and the only view that can hold both sides of the injection), shipped (the composition the nine published cells before that were measured in, whose start time is scaled by 1000 a second time so its `edgeLatency` is empty on all nine and two mechanisms are inert behind it), or capped (the same cap with the unit repaired). The default moved on run 40128592846: whole-file takes RE2-TrainTicket 71.1 to 74.4 and costs RE2-OnlineBoutique 2.3, with the other seven cells unmoved — the gain lands on the only cell this project was behind on and the cost on one it leads by 27.7 pp. It is a CORPUS property rather than a ranking one, so it is forwarded in its own array and the configuration line does not name it — a separate `corpus:` line does, in the banner and in the diagnose dump's header from the same string. Needed because the floor and the corpus are an INTERACTION: neither moves a published cell alone, and only their cross product moves one at all, so varying one of the two measures the effect of neither. A value the union does not contain falls back to the shipped view rather than inventing a corpus"
        required: false
        default: ''
        type: string
      diagnose_dump:
        description: "Write the FSE'26 signal diagnostic for every diagnosed case, one file per invocation, uploaded as an artifact. This is what lets the weight solver, the family screen and the decisive-stability screen run on THIS benchmark offline, instead of costing a dispatch per weight (empty = off)"
        required: false
        default: ''
        type: string
      diagnose_decimals:
        description: "Decimals per service field in the diagnostic dump — the precision of the ARTIFACT rather than of the run. Leave it empty for the runner default (3), which is the artifact every dump written so far is. Raise it only to test a claim about the reader's error bar: every block header states this number, so a reader takes its resolution box from the file itself, and a finer artifact re-opens windows the three-decimal render could not decide. A value the renderer cannot express falls back to the default instead of crashing the run (empty = the runner default)"
        required: false
        default: ''
        type: string
      anomaly_knobs:
        description: "The ranking's packed knob block, as a comma-separated name=value list (empty = every shipped value). The keys, in the order they were added: `trend`, `burst`, `cv`, `breadth`, `gate` (the anomaly composition, shipped 0.15/0/0.05/0.05/0.8); `selftime`, `victim`, `dualfam`, `dualfamgate`, `dualfamgatemode`, `traceskipsleader` (ranking terms); `dropdev`, `ceil` (the drop-deviation pair and the rise ceiling); `zerolat`, `trendcap` (two guards, each taking 1 or 0). An unknown key fails the step rather than being ignored, because a typo that silently ran the shipped configuration would publish a number whose configuration line disagreed with the dispatch. The composition half IS the RCAEval RE1 ranking They ARE the RCAEval RE1 ranking — on that population every other term is WEIGHT_ZERO or INPUT_MAP_EMPTY on all 374 analysable cases, so the published RE1 number is `deviation + 0.15*trend + 0.1*deviation*burst + 0.05*cv` plus a 0.007352 tie-break — and before this input they were three literals inside `computeAnomalyFeatures` that no dispatch could vary. A weight above the engine's bound of 10 is refused at graph build rather than clamped. One input for three knobs because a `workflow_dispatch` accepts at most 25 inputs and this workflow is AT that budget: `topo_discount` was retired to make room, since it was measured and refused on all 735 cases at two values (RE1 83.47 -> 68.53 at rho=0.25) and its release record is `docs/dispatch-forwarding.md`"
        required: false
        default: ''
        type: string
      scopes:
        description: "Which jobs of the battery to run, comma separated (empty = every job, the shipped behaviour). `golden` runs only the three RCAEval runners and the dashboard; `ablation` and `optimize` name the two exploration jobs. It exists because the answer this workflow produces takes 30 minutes and the run that delivers it takes two: `optimize-rcaeval` and `ablation-re2` are serialised after the golden jobs, they are exploration rather than gates, and a dispatch that asks one question should not pay for them. Run `40133507548` is the argument — the optimiser hit its 60-minute bound at 22:17 and the RUN was reported `cancelled` although all nine cells had already succeeded and been uploaded. A job that did not run is not a job that failed, and this input is how a dispatch says which it is asking for"
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/benchmark-rcaeval.yml'
      - 'scripts/convert-parquet-to-json.py'
      - 'benchmarks/src/**'
      # The ENGINE. `packages/tree` holds the shipped score, the weights and the pruner, so it is the
      # only tree that can move the golden 9-cell — and until this entry existed, a push touching
      # nothing but `packages/.../src` triggered no benchmark at all. The kill criterion's second half
      # is a claim about a RUN; a criterion nothing runs is not a criterion. Guarded by
      # `benchmarks/__tests__/benchmark-rcaeval-trigger.test.ts`, which reads this list as text.
      - 'packages/*/src/**'
  workflow_run:
    workflows: [Cache Benchmark Datasets]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write
  # The `artifact` job asks the caches API whether the dataset this bridge produces has been
  # published yet. A `permissions:` block REPLACES the defaults, so without this line the wait would
  # answer 403 — and a 403 looks exactly like an artifact that is not there.
  actions: read

jobs:
  # ── The producer is ANOTHER workflow, started by the same push ──
  # Measured 2026-09-25: a push that changed the bridge started both `cache-datasets.yml` and this
  # workflow, and this workflow's `consume` step refused four jobs — correctly, because the artifact
  # whose producer is this commit's bridge did not exist YET. The refusal is not the thing to loosen
  # (the alternative is reading another bridge's dataset and reporting it as a measurement of this
  # tree); the missing declaration was a bounded wait for a dependency still being produced, and this
  # job is that wait, declared ONCE rather than in each of the seven consumers.
  #
  # The bound is licensed by the producer: `cache-datasets.yml` bounds its `cache` job at 60 minutes
  # and has taken 20.1 and 20.7 minutes to convert, so 35 minutes is the conservative half of that
  # and a wait that expires is a statement about the producer. `actions: read` above is what the
  # caches API needs.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the dataset this bridge produces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/rcaeval_provenance.py --root scripts --await

  # ── Synthetic: fast, no external data ──
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run synthetic benchmark (175 cases)
        run: |
          pnpm exec tsx benchmarks/src/run-all.ts --cases 175 --output benchmark-results.json
      - name: Run adaptive optimizer
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/optimize-all.ts 2>&1 | tee optimize-results.txt
      - name: Upload synthetic results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-results
          path: benchmark-results.json
      - name: Upload optimizer results
        uses: actions/upload-artifact@v4
        with:
          name: optimize-results
          path: optimize-results.txt

  # ── RCAEval: 3 parallel runners (RE1 / RE2 / RE3) ──
  rcaeval-re1:
    needs: [synthetic, artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        # `consume`: the artifact must exist AND must state this checkout's bridge. A miss fails here
        # rather than letting the battery run against an absent directory and report an empty result
        # as a measurement. The key, the path and the trust live in the action, which derives the key
        # from the bridge itself -- the constant this replaced named nothing, at seven sites in this
        # file alone, and its `restore-keys` prefix could never match it.
        uses: ./.github/actions/rcaeval-json
        with:
          mode: consume
      - name: Run RCAEval — RE1 only
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          STABILITY_ARG=()
          # `if`/`fi` rather than `[ -n ... ] &&`, because GitHub's bash runs with `-e`:
          # a bare failing test would abort the step before the benchmark ran.
          if [ -n "${{ inputs.stability_weight }}" ]; then
            STABILITY_ARG=(--stability-weight "${{ inputs.stability_weight }}")
          fi
          RANKING_ARG=()
          # The knobs BOTH runners accept, so a candidate on any of them can be measured on this
          # benchmark without moving a default to do it — the golden half of the kill criterion.
          # Every one is empty by default, so a PUSH passes no flag at all and the nine cells stay
          # byte-identical; the guard that keeps that true is the same one that reads the accepted
          # set out of each parser.
          if [ -n "${{ inputs.log_weight }}" ]; then
            RANKING_ARG+=(--log-weight "${{ inputs.log_weight }}")
          fi
          #   The MODE travels with the weight: a weight is a claim about which lines count, so
          #   asking for one without being able to name the other measures half a term. Both are
          #   passed only when the dispatch input is non-empty, so the runner's default stays the
          #   single source of truth for the shipped configuration.
          if [ -n "${{ inputs.log_signal_mode }}" ]; then
            RANKING_ARG+=(--log-signal-mode "${{ inputs.log_signal_mode }}")
          fi
          if [ -n "${{ inputs.temporal_weight }}" ]; then
            RANKING_ARG+=(--temporal-weight "${{ inputs.temporal_weight }}")
          fi
          if [ -n "${{ inputs.onset_shape }}" ]; then
            RANKING_ARG+=(--onset-shape "${{ inputs.onset_shape }}")
          fi
          if [ -n "${{ inputs.no_rank_normalization }}" ]; then
            RANKING_ARG+=(--no-rank-normalization)
          fi
          #   The axis's second half. It travels with the boolean for the reason the latency pair travels
          #   together: the boolean alone cannot say which cases it acted on, so a dispatch able to name
          #   only the flag could not measure the population, and the two are read as one configuration.
          if [ -n "${{ inputs.anomaly_normalize_threshold }}" ]; then
            RANKING_ARG+=(--anomaly-normalize-threshold "${{ inputs.anomaly_normalize_threshold }}")
          fi
          #   The terms and switches the GOLDEN CLI always accepted, the engine options always carried and
          #   the configuration line always NAMED — and that no dispatch could state. `UNDISPATCHABLE_ON_RCAEVAL`
          #   in the dispatch-surface census is the register's inventory of exactly those, and this block is
          #   what empties it: an option that is printed, forwarded and unreachable makes every artifact assert
          #   a configuration nobody can ask for, and the kill criterion is an AND over two benchmarks, so a
          #   knob only the FSE'26 half can vary has an undecidable golden half.
          #
          #   All eight are empty by default, so a PUSH passes no flag at all and the nine cells stay
          #   byte-identical — and the `signals:` line already prints every one of them, so it does not move
          #   either. That is what makes this block's acceptance exact rather than argued.
          if [ -n "${{ inputs.trace_weight }}" ]; then
            RANKING_ARG+=(--trace-weight "${{ inputs.trace_weight }}")
          fi
          if [ -n "${{ inputs.topo_weight }}" ]; then
            RANKING_ARG+=(--topo-weight "${{ inputs.topo_weight }}")
          fi
          # The anomaly composition, as `name=value` pairs. An unknown key FAILS the step rather than
          # being ignored: a typo that silently ran the shipped composition would produce an artifact whose
          # configuration line disagrees with the dispatch, which is exactly what `topo_discount`'s
          # retirement record is about.
          for kv in $(echo "${{ inputs.anomaly_knobs }}" | tr ',' ' '); do
            case "$kv" in
              trend=*) RANKING_ARG+=(--anomaly-trend-weight "${kv#trend=}") ;;
              burst=*) RANKING_ARG+=(--anomaly-burst-weight "${kv#burst=}") ;;
              cv=*) RANKING_ARG+=(--anomaly-cv-weight "${kv#cv=}") ;;
              breadth=*) RANKING_ARG+=(--anomaly-breadth-weight "${kv#breadth=}") ;;
              gate=*) RANKING_ARG+=(--anomaly-breadth-gate "${kv#gate=}") ;;
              selftime=*) RANKING_ARG+=(--self-time-weight "${kv#selftime=}") ;;
              victim=*) RANKING_ARG+=(--victim-weight "${kv#victim=}") ;;
              dualfam=*) RANKING_ARG+=(--dual-family-weight "${kv#dualfam=}") ;;
              #   The membership's POPULATION. `gate=*` is the anomaly breadth gate, so this one needs its
              #   own unambiguous key: a `0` here is the identity (the family 144 enrolled), and anything
              #   above it keeps only the components within that share of the fleet's strongest dual signal.
              dualfamgate=*) RANKING_ARG+=(--dual-family-gate "${kv#dualfamgate=}") ;;
              #   The gate's DENOMINATOR. Beside the gate it qualifies, because a number and the comparison it is
              #   applied to are one configuration: `min` bars a component against the fleet's best joint
              #   candidate, `channel` against each family's own champion.
              dualfamgatemode=*) RANKING_ARG+=(--dual-family-gate-mode "${kv#dualfamgatemode=}") ;;
              dropdev=*) RANKING_ARG+=(--drop-deviation-mode "${kv#dropdev=}") ;;
              #   Which WINDOW the deviation is measured between. Beside `dropdev` because the two answer
              #   one question at two depths: the mode decides how a direction becomes a number, the anchor
              #   decides which samples that number is measured on.
              anchor=*) RANKING_ARG+=(--baseline-anchor "${kv#anchor=}") ;;
              ceil=*) RANKING_ARG+=(--rise-ceiling "${kv#ceil=}") ;;
              zerolat=*)
                # Both poles, because the flag is a GUARD: `0` is the shipped state and has to stay
                # reachable or an ablation cannot name the control it is read against.
                case "${kv#zerolat=}" in
                  1) RANKING_ARG+=(--suppress-zero-baseline-latency) ;;
                  0) RANKING_ARG+=(--no-suppress-zero-baseline-latency) ;;
                  *) echo "::error::anomaly_knobs: zerolat takes 1 or 0, got '${kv#zerolat=}'"; exit 1 ;;
                esac ;;
              trendcap=*)
                case "${kv#trendcap=}" in
                  1) RANKING_ARG+=(--cap-trend-bonus-at-deviation) ;;
                  0) RANKING_ARG+=(--no-cap-trend-bonus-at-deviation) ;;
                  *) echo "::error::anomaly_knobs: trendcap takes 1 or 0, got '${kv#trendcap=}'"; exit 1 ;;
                esac ;;
              #   The trace vote's leader mask. Both poles, because `false` is the shipped state and an ablation
              #   has to be able to name the control it is read against; inert at the `trace_weight = 0` the seven
              #   non-RE3 cells run, which is why it costs nothing to state on any of them.
              traceskipsleader=*)
                case "${kv#traceskipsleader=}" in
                  1) RANKING_ARG+=(--trace-skips-leader) ;;
                  0) RANKING_ARG+=(--no-trace-skips-leader) ;;
                  *) echo "::error::anomaly_knobs: traceskipsleader takes 1 or 0, got '${kv#traceskipsleader=}'"; exit 1 ;;
                esac ;;
              *) echo "::error::anomaly_knobs: unknown key '$kv'"; exit 1 ;;
            esac
          done
          if [ -n "${{ inputs.collision_weight }}" ]; then
            RANKING_ARG+=(--collision-weight "${{ inputs.collision_weight }}")
          fi
          if [ -n "${{ inputs.prism_weight }}" ]; then
            RANKING_ARG+=(--prism-weight "${{ inputs.prism_weight }}")
          fi
          if [ -n "${{ inputs.prism_pooling }}" ]; then
            RANKING_ARG+=(--prism-pooling "${{ inputs.prism_pooling }}")
          fi
          if [ -n "${{ inputs.collapse_discount }}" ]; then
            RANKING_ARG+=(--collapse-discount "${{ inputs.collapse_discount }}")
          fi
          if [ -n "${{ inputs.suppress_idle_transients }}" ]; then
            RANKING_ARG+=(--suppress-idle-transients)
          fi
          if [ -n "${{ inputs.suppress_near_zero_baseline_rise }}" ]; then
            RANKING_ARG+=(--suppress-near-zero-baseline-rise)
          fi
          #   The demand guard ships ON, so the reachable pole is the NEGATIVE: an input that could only
          #   switch it on would be an input that never changes anything. `0` is the ablation, spelled the way
          #   the FSE'26 workflow's `ranking_knobs` spells its own booleans.
          if [ "${{ inputs.suppress_demand_metrics }}" = "0" ]; then
            RANKING_ARG+=(--no-suppress-demand-metrics)
          fi
          #   The LATENCY PAIR travels together for the reason the mode travels with its weight: the
