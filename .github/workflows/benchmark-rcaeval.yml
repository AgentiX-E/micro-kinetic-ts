name: Benchmark — RCAEval Full Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-rcaeval.yml'
      - 'packages/**/src/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore cached RCAEval datasets
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/RCAEval-data
          key: RCAEval-datasets-v2-pq
          restore-keys: |
            RCAEval-datasets-

      - name: Verify dataset availability
        run: |
          TOTAL_FILES=$(find ~/RCAEval-data -type f 2>/dev/null | wc -l)
          PARQUET_FILES=$(find ~/RCAEval-data -name '*.parquet' 2>/dev/null | wc -l)
          echo "Total files: $TOTAL_FILES"
          echo "Parquet files: $PARQUET_FILES"
          if [ "$TOTAL_FILES" -lt 50 ]; then
            echo "::warning::Insufficient cached files ($TOTAL_FILES). Run Cache Datasets workflow first."
          fi
          # Check data dirs
          find ~/RCAEval-data -maxdepth 2 -type d 2>/dev/null | head -20

      - name: Convert Parquet to RCAEval JSON (pandas bridge)
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          pip install pandas pyarrow 2>/dev/null || true
          python3 -c "
          import os, json
          from pathlib import Path
          import pandas as pd

          cache_dir = os.path.expanduser('~/RCAEval-data')
          out_dir = os.path.expanduser('~/RCAEval-json')
          os.makedirs(out_dir, exist_ok=True)

          # Discover case directories (those containing metrics.parquet or inject_time.parquet)
          case_dirs = set()
          for pq in Path(cache_dir).rglob('*.parquet'):
              rel = pq.relative_to(cache_dir)
              # Case dir is the parent of the Parquet file
              case_dirs.add(rel.parent)

          print(f'Found {len(case_dirs)} case directories')
          converted = 0

          for case_rel in sorted(case_dirs):
              case_src = Path(cache_dir) / case_rel
              case_dst = Path(out_dir) / case_rel
              os.makedirs(case_dst, exist_ok=True)

              try:
                  # ── Convert metrics.parquet → old-style nested JSON ──
                  metrics_pq = case_src / 'metrics.parquet'
                  if metrics_pq.exists():
                      df = pd.read_parquet(metrics_pq)
                      metrics_out = {}

                      # Detect format: wide (time-indexed) vs long (tidy)
                      #   Wide: rows=timestamps, cols=metric_labels like "svc_name::metric"
                      #   Long: columns include 'service', 'timestamp', 'value', 'metric_name'
                      first_col = str(df.columns[0]) if len(df.columns) > 0 else ''

                      if 'service' in df.columns or 'service_id' in df.columns:
                          # Long/tidy format
                          svc_col = next((c for c in df.columns if c in ('service', 'service_id', 'serviceId')), df.columns[0])
                          ts_col = next((c for c in df.columns if c in ('timestamp', 'time', 'ts')), None)
                          val_col = next((c for c in df.columns if c in ('value', 'val')), None)
                          metric_col = next((c for c in df.columns if c in ('metric_name', 'metric', 'name')), None)
                          for _, row in df.iterrows():
                              svc = str(row[svc_col])
                              if svc not in metrics_out:
                                  metrics_out[svc] = []
                              metrics_out[svc].append({
                                  'timestamp': int(row[ts_col]) if ts_col and ts_col in row else 0,
                                  'value': float(row[val_col]) if val_col and val_col in row else 0.0,
                                  'metric_name': str(row[metric_col]) if metric_col and metric_col in row else '',
                              })
                      else:
                          # Wide format: melt into long form
                          # Columns: {timestamp} | svc::metric | svc::metric | ...
                          ts_vals = df.iloc[:, 0].tolist() if len(df.columns) > 0 else []
                          for col in df.columns[1:]:
                              col_str = str(col)
                              # Parse "service::metric" or "service_metric" convention
                              parts = col_str.split('::') if '::' in col_str else col_str.rsplit('_', 1)
                              svc = parts[0] if len(parts) >= 1 else col_str
                              metric = parts[1] if len(parts) >= 2 else col_str
                              for idx, val in enumerate(df[col]):
                                  ts = int(ts_vals[idx]) if idx < len(ts_vals) else 0
                                  if svc not in metrics_out:
                                      metrics_out[svc] = []
                                  metrics_out[svc].append({
                                      'timestamp': ts,
                                      'value': float(val) if pd.notna(val) else 0.0,
                                      'metric_name': metric,
                                  })
                      with open(case_dst / 'metrics.json', 'w') as f:
                          json.dump(metrics_out, f)

                  # ── Copy inject_time (may be parquet or txt) ──
                  inject_pq = case_src / 'inject_time.parquet'
                  inject_txt = case_src / 'inject_time.txt'
                  if inject_pq.exists():
                      df = pd.read_parquet(inject_pq)
                      val = int(df.iloc[0, 0]) if len(df) > 0 else 0
                      (case_dst / 'inject_time.txt').write_text(str(val))
                  elif inject_txt.exists():
                      import shutil
                      shutil.copy(inject_txt, case_dst / 'inject_time.txt')

                  # ── Copy ground_truth ──
                  for gt_name in ['ground_truth.json', 'ground_truth.parquet']:
                      gt_src = case_src / gt_name
                      if gt_src.exists():
                          if gt_src.suffix == '.parquet':
                              df = pd.read_parquet(gt_src)
                              gt_data = df.iloc[0].to_dict() if len(df) > 0 else {}
                              with open(case_dst / 'ground_truth.json', 'w') as f:
                                  json.dump(gt_data, f, default=str)
                          else:
                              import shutil
                              shutil.copy(gt_src, case_dst / 'ground_truth.json')
                          break

                  # ── Copy logs/traces if present ──
                  for aux_file in case_src.glob('*'):
                      if aux_file.suffix in ['.csv', '.txt'] and aux_file.name not in ['metrics.parquet', 'inject_time.parquet']:
                          import shutil
                          shutil.copy(aux_file, case_dst / aux_file.name)

                  converted += 1
              except Exception as e:
                  print(f'  Skip {case_rel}: {e}')

          print(f'Converted {converted}/{len(case_dirs)} case directories to RCAEval JSON at {out_dir}')
          "

      - name: Verify converted JSON
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          JSON_COUNT=$(find ~/RCAEval-json -name '*.json' 2>/dev/null | wc -l)
          echo "JSON files available: $JSON_COUNT"
          find ~/RCAEval-json -maxdepth 3 -type d 2>/dev/null | head -20

      - name: Run Micro-Kinetic benchmark (synthetic + classifier)
        run: |
          pnpm exec tsx benchmarks/src/run-all.ts --cases 175 --output benchmark-results.json
          echo "=== Synthetic benchmark complete ==="
          cat benchmark-results.json

      - name: Run RCAEval industry-standard benchmark (per-system, per-dataset)
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "=== RCAEval industry-standard benchmark ==="
          pnpm exec tsx benchmarks/src/run-rcaeval.ts 2>&1 | tee rcaeval-results.txt
          echo "=== RCAEval benchmark complete ==="

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            rcaeval-results.txt

      - name: Post summary
        run: |
          echo '## Micro-Kinetic Synthetic Benchmark' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## RCAEval Real Dataset Benchmark (per-system, per-dataset)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f rcaeval-results.txt ]; then
            cat rcaeval-results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'No RCAEval results (cache miss)' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit results to repo
        if: github.event_name == 'workflow_dispatch' && steps.cache.outputs.cache-hit == 'true' && success()
        run: |
          if [ ! -f rcaeval-results.txt ]; then
            echo "No RCAEval results to commit"
            exit 0
          fi
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "# Micro-Kinetic RCAEval Benchmark"
            echo ""
            echo "**Date**: $TIMESTAMP"
            echo "**Commit**: $GITHUB_SHA"
            echo ""
            cat rcaeval-results.txt
          } > BENCHMARK.md
          git config user.email "ci@agentix-e.dev"
          git config user.name "CI Bot"
          git add BENCHMARK.md
          git diff --staged --quiet || git commit -m "ci: update benchmark results $TIMESTAMP"
          git push origin main

          # Write results to a JSON file for API access
          if [ -f rcaeval-results.txt ]; then
            python3 -c "
import json, sys
results = {'raw': open('rcaeval-results.txt').read()}
with open('rcaeval-summary.json', 'w') as f:
    json.dump(results, f)
"
          fi
