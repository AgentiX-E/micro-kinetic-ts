          fi
          #   The MODE travels with the weight: a weight is a claim about which lines count, so
          #   asking for one without being able to name the other measures half a term. Both are
          #   passed only when the dispatch input is non-empty, so the runner's default stays the
          #   single source of truth for the shipped configuration.
          if [ -n "${{ inputs.log_signal_mode }}" ]; then
            RANKING_ARG+=(--log-signal-mode "${{ inputs.log_signal_mode }}")
          fi
          if [ -n "${{ inputs.temporal_weight }}" ]; then
            RANKING_ARG+=(--temporal-weight "${{ inputs.temporal_weight }}")
          fi
          if [ -n "${{ inputs.onset_shape }}" ]; then
            RANKING_ARG+=(--onset-shape "${{ inputs.onset_shape }}")
          fi
          if [ -n "${{ inputs.no_rank_normalization }}" ]; then
            RANKING_ARG+=(--no-rank-normalization)
          fi
          DIAGNOSE_ARG=()
          # One file per STEP, because the three RE3 invocations share a job: a single
          # path would leave only the last configuration's cases on disk, and a dump
          # that is silently one configuration is what the fidelity line cannot see.
          if [ -n "${{ inputs.diagnose_dump }}" ]; then
            DIAGNOSE_ARG=(--diagnose-dump rcaeval-diagnose-re2.txt)
            if [ -n "${{ inputs.diagnose_decimals }}" ]; then
              DIAGNOSE_ARG+=(--diagnose-decimals "${{ inputs.diagnose_decimals }}")
            fi
          fi
          # NO `--max-cases`, and this is a CORPUS repair rather than a runtime one. RE2 ships **90 cases per
          # system** (270 overall: 6 fault types x 5 services x 3 repetitions) and this invocation ranked the
          # first **50**, leaving 120 cases — 44% of RE2 — unmeasured. The damage was not the missing cases but
          # the claim they fed: `docs/sota-comparison.md` folds the suite means with the PUBLISHED suite sizes
          # (`(375x0.803 + 270x0.798 + 90x0.587) / 735`), so a 150-case RE2 mean was weighted as if all 270 had
          # been ranked, and `docs/prism-head-to-head.md` printed that mean in a column beside a competitor
          # evaluated on all 735. **A benchmark claim cannot be weighted by a corpus it did not rank.** RE1
          # (125/system) and RE3 (30/system) were never capped, which is why they are the control for this
          # change: the corpus grows for RE2 alone and their cells must not move.
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re2 "${STABILITY_ARG[@]}" "${RANKING_ARG[@]}" "${DIAGNOSE_ARG[@]}" 2>&1 | tee rcaeval-re2-results.txt
      - name: Upload RE2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-re2-results
          path: |
            rcaeval-re2-results.txt
            rcaeval-diagnose-re2.txt
      - name: Run RCAEval — RE2 only (no inject_time)
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          STABILITY_ARG=()
          # `if`/`fi` rather than `[ -n ... ] &&`, because GitHub's bash runs with `-e`:
          # a bare failing test would abort the step before the benchmark ran.
          if [ -n "${{ inputs.stability_weight }}" ]; then
            STABILITY_ARG=(--stability-weight "${{ inputs.stability_weight }}")
          fi
          RANKING_ARG=()
          # The knobs BOTH runners accept, so a candidate on any of them can be measured on this
          # benchmark without moving a default to do it — the golden half of the kill criterion.
          # Every one is empty by default, so a PUSH passes no flag at all and the nine cells stay
          # byte-identical; the guard that keeps that true is the same one that reads the accepted
          # set out of each parser.
          if [ -n "${{ inputs.log_weight }}" ]; then
            RANKING_ARG+=(--log-weight "${{ inputs.log_weight }}")
          fi
          #   The MODE travels with the weight: a weight is a claim about which lines count, so
          #   asking for one without being able to name the other measures half a term. Both are
          #   passed only when the dispatch input is non-empty, so the runner's default stays the
          #   single source of truth for the shipped configuration.
          if [ -n "${{ inputs.log_signal_mode }}" ]; then
            RANKING_ARG+=(--log-signal-mode "${{ inputs.log_signal_mode }}")
          fi
          if [ -n "${{ inputs.temporal_weight }}" ]; then
            RANKING_ARG+=(--temporal-weight "${{ inputs.temporal_weight }}")
          fi
          if [ -n "${{ inputs.onset_shape }}" ]; then
            RANKING_ARG+=(--onset-shape "${{ inputs.onset_shape }}")
          fi
          if [ -n "${{ inputs.no_rank_normalization }}" ]; then
            RANKING_ARG+=(--no-rank-normalization)
          fi
          DIAGNOSE_ARG=()
          # One file per STEP, because the three RE3 invocations share a job: a single
          # path would leave only the last configuration's cases on disk, and a dump
          # that is silently one configuration is what the fidelity line cannot see.
          if [ -n "${{ inputs.diagnose_dump }}" ]; then
            DIAGNOSE_ARG=(--diagnose-dump rcaeval-diagnose-re2-noinject.txt)
            if [ -n "${{ inputs.diagnose_decimals }}" ]; then
              DIAGNOSE_ARG+=(--diagnose-decimals "${{ inputs.diagnose_decimals }}")
            fi
          fi
          # The fidelity control for the line above, on the SAME corpus: without this the pair would compare a
          # full corpus against a subset, which is the defect the cap removal repaired one level up.
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re2 --no-inject-time "${STABILITY_ARG[@]}" "${RANKING_ARG[@]}" "${DIAGNOSE_ARG[@]}" 2>&1 | tee rcaeval-re2-noinject-results.txt
      - name: Upload RE2 no-inject results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-re2-noinject-results
          path: |
            rcaeval-re2-noinject-results.txt
            rcaeval-diagnose-re2-noinject.txt

