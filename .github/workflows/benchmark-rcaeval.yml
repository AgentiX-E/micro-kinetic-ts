                  1) RANKING_ARG+=(--cap-trend-bonus-at-deviation) ;;
                  0) RANKING_ARG+=(--no-cap-trend-bonus-at-deviation) ;;
                  *) echo "::error::anomaly_knobs: trendcap takes 1 or 0, got '${kv#trendcap=}'"; exit 1 ;;
                esac ;;
              #   The trace vote's leader mask. Both poles, because `false` is the shipped state and an ablation
              #   has to be able to name the control it is read against; inert at the `trace_weight = 0` the seven
              #   non-RE3 cells run, which is why it costs nothing to state on any of them.
              traceskipsleader=*)
                case "${kv#traceskipsleader=}" in
                  1) RANKING_ARG+=(--trace-skips-leader) ;;
                  0) RANKING_ARG+=(--no-trace-skips-leader) ;;
                  *) echo "::error::anomaly_knobs: traceskipsleader takes 1 or 0, got '${kv#traceskipsleader=}'"; exit 1 ;;
                esac ;;
              *) echo "::error::anomaly_knobs: unknown key '$kv'"; exit 1 ;;
            esac
          done
          if [ -n "${{ inputs.collision_weight }}" ]; then
            RANKING_ARG+=(--collision-weight "${{ inputs.collision_weight }}")
          fi
          if [ -n "${{ inputs.prism_weight }}" ]; then
            RANKING_ARG+=(--prism-weight "${{ inputs.prism_weight }}")
          fi
          if [ -n "${{ inputs.prism_pooling }}" ]; then
            RANKING_ARG+=(--prism-pooling "${{ inputs.prism_pooling }}")
          fi
          if [ -n "${{ inputs.collapse_discount }}" ]; then
            RANKING_ARG+=(--collapse-discount "${{ inputs.collapse_discount }}")
          fi
          if [ -n "${{ inputs.suppress_idle_transients }}" ]; then
            RANKING_ARG+=(--suppress-idle-transients)
          fi
          if [ -n "${{ inputs.suppress_near_zero_baseline_rise }}" ]; then
            RANKING_ARG+=(--suppress-near-zero-baseline-rise)
          fi
          #   The demand guard ships ON, so the reachable pole is the NEGATIVE: an input that could only
          #   switch it on would be an input that never changes anything. `0` is the ablation, spelled the way
          #   the FSE'26 workflow's `ranking_knobs` spells its own booleans.
          if [ "${{ inputs.suppress_demand_metrics }}" = "0" ]; then
            RANKING_ARG+=(--no-suppress-demand-metrics)
          fi
          #   The LATENCY PAIR travels together for the reason the mode travels with its weight: the
          #   floor is not safe on its own and the weight's zero-regression window ends far below its
          #   shipped value without it, so a dispatch able to name one of the two could still not
          #   measure the pair. Both spellings are the FSE'26 runner's own, so one value means one
          #   thing in both workflows.
          if [ -n "${{ inputs.lat_weight }}" ]; then
            RANKING_ARG+=(--lat-weight "${{ inputs.lat_weight }}")
          fi
          if [ -n "${{ inputs.failed_edge_weight }}" ]; then
            RANKING_ARG+=(--failed-edge-weight "${{ inputs.failed_edge_weight }}")
          fi
          if [ -n "${{ inputs.lat_min_rise }}" ]; then
            RANKING_ARG+=(--lat-min-rise "${{ inputs.lat_min_rise }}")
          fi
          #   The pool penalty is the third of the three the artifact NAMED for several iterations
          #   before any command line could set them: a value that is printed, forwarded, and
          #   unreachable makes the configuration line assert a configuration no dispatch can state.
          if [ -n "${{ inputs.pool_penalty }}" ]; then
            RANKING_ARG+=(--pool-penalty "${{ inputs.pool_penalty }}")
          fi
          #   A SEPARATE array, because this one is NOT part of the vocabulary the two runners share:
          #   `run-fse26.ts` reads no spans at all, so the view is meaningless there and its parser
          #   refuses the flag. On THIS half it is the corpus axis of the floor interaction —
          #   `edgeLatency` comes from the corpus, so this knob can move a cell without moving a
          #   weight, and neither axis moves a published cell alone.
          CORPUS_ARG=()
          if [ -n "${{ inputs.latency_view }}" ]; then
            CORPUS_ARG+=(--latency-view "${{ inputs.latency_view }}")
          fi
          DIAGNOSE_ARG=()
          # One file per STEP, because the three RE3 invocations share a job: a single
          # path would leave only the last configuration's cases on disk, and a dump
          # that is silently one configuration is what the fidelity line cannot see.
          if [ -n "${{ inputs.diagnose_dump }}" ]; then
            DIAGNOSE_ARG=(--diagnose-dump rcaeval-diagnose-re3-novelty.txt)
            if [ -n "${{ inputs.diagnose_decimals }}" ]; then
              DIAGNOSE_ARG+=(--diagnose-decimals "${{ inputs.diagnose_decimals }}")
            fi
          fi
          # The loss census is allocated unconditionally, unlike the opt-in diagnose dump: the split it
          # reports is a claim about the run the accuracy came from, so it is produced by every run.
          CENSUS_ARG=(--loss-census rcaeval-loss-census-re3-novelty.jsonl)
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re3 --no-inject-time --log-signal-mode novelty "${STABILITY_ARG[@]}" "${RANKING_ARG[@]}" "${CORPUS_ARG[@]}" "${DIAGNOSE_ARG[@]}" "${CENSUS_ARG[@]}" 2>&1 | tee rcaeval-re3-novelty-results.txt
      - name: Upload RE3 novelty results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-re3-novelty-results
          # Both files below are produced by EVERY run, so a missing one is a defect in the run and not a
          # configuration the dispatch did not ask for. `error` is what makes that a red job: with the
          # default `warn` the upload succeeds, the artifact looks complete, and the absence is only
          # visible to a reader who tries to fetch the file.
          if-no-files-found: error
          path: |
            rcaeval-re3-novelty-results.txt
            rcaeval-loss-census-re3-novelty.jsonl
      # The diagnose dump is OPT-IN (`inputs.diagnose_dump`), so it is uploaded by its own step on the
      # condition that produces it. Listed beside unconditional files it made an artifact that named a
      # file no default run writes -- which is how a reader comes to believe the diagnostics are in it.
      - name: Upload RE3 novelty diagnose dump
        if: ${{ inputs.diagnose_dump != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-re3-novelty-diagnose
          if-no-files-found: error
          path: rcaeval-diagnose-re3-novelty.txt

  # ── Ablation: 3 parallel runners (RE1 / RE2 / RE3) ──
  ablation-re1:
    needs: rcaeval-re1
    if: needs.rcaeval-re1.result == 'success' && (inputs.scopes == '' || contains(inputs.scopes, 'ablation'))
    runs-on: ubuntu-latest
    # `timeout-minutes` is a WORKING-versus-STUCK bound, not a target, and the corpus work moved the real cost
    # past it: `ablation-re2` measured **53.6 min** on run `37838593082` at 150 cases and **77.8 min** on run
    # `38145565230` at RE2's full 270 (it was ~14 min before the curves were augmented from traces). The battery
    # is **34 configs**: 30, then 33 when the latency-channel rows were added, then 34 when the crossed cell
    # (`LAT WHOLE FILE + NO FLOOR`) joined them — one row is ~1/33 of a run, which is why the added row moved no
    # bound. A bound a WORKING job can hit classifies a healthy run as STUCK, which costs more than a longer
    # wait; `golden_run_landing.py` reads this number.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        # `consume`: the artifact must exist AND must state this checkout's bridge. A miss fails here
        # rather than letting the battery run against an absent directory and report an empty result
        # as a measurement. The key, the path and the trust live in the action, which derives the key
        # from the bridge itself -- the constant this replaced named nothing, at seven sites in this
        # file alone, and its `restore-keys` prefix could never match it.
        uses: ./.github/actions/rcaeval-json
        with:
          mode: consume
      - name: Run ablation — RE1 only
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-ablation.ts --data-dir ~/RCAEval-json --suite re1 2>&1 | tee ablation-re1-results.txt
      - name: Upload ablation RE1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablation-re1-results
          path: |
            ablation-re1-results.txt
            ablation-results.json

  ablation-re2:
    needs: rcaeval-re2
    if: needs.rcaeval-re2.result == 'success' && (inputs.scopes == '' || contains(inputs.scopes, 'ablation'))
    runs-on: ubuntu-latest
    # The binding job, and it moved again when the corpus did. Measured at **150 cases** (the capped corpus):
    # 54.3 min on run `37858643162`. At RE2's full 270 it is **77.8 min** on run `38145565230`, so the earlier
    # ~98 projection was conservative by 20 min and a bound of 90 would still have been exceeded by work that is
    # not stuck. See `ablation-re1` for why the bound moves rather than the battery shrinking.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        # `consume`: the artifact must exist AND must state this checkout's bridge. A miss fails here
        # rather than letting the battery run against an absent directory and report an empty result
        # as a measurement. The key, the path and the trust live in the action, which derives the key
        # from the bridge itself -- the constant this replaced named nothing, at seven sites in this
        # file alone, and its `restore-keys` prefix could never match it.
        uses: ./.github/actions/rcaeval-json
        with:
          mode: consume
      - name: Run ablation — RE2 only
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          # Same corpus as the published cells, for the reason above: the STUDY's baseline is a row of the
          # ledger, and a ledger whose baseline ranks 150 of RE2's 270 cases cannot be compared with cells
          # measured on the other corpus — the parity iteration 72 bought (14 of 14) is exactly this.
          pnpm exec tsx benchmarks/src/run-ablation.ts --data-dir ~/RCAEval-json --suite re2 2>&1 | tee ablation-re2-results.txt
      - name: Upload ablation RE2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablation-re2-results
          path: |
            ablation-re2-results.txt
            ablation-results.json

  ablation-re3:
    needs: rcaeval-re3
    if: needs.rcaeval-re3.result == 'success' && (inputs.scopes == '' || contains(inputs.scopes, 'ablation'))
    runs-on: ubuntu-latest
    # **30.7 min of 90** — 32.4 min at 30 configs on run `37838593082`, 30.7 min at 33 on run `38145565230`.
    # See `ablation-re1` for why the bound moved.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        # `consume`: the artifact must exist AND must state this checkout's bridge. A miss fails here
        # rather than letting the battery run against an absent directory and report an empty result
        # as a measurement. The key, the path and the trust live in the action, which derives the key
        # from the bridge itself -- the constant this replaced named nothing, at seven sites in this
        # file alone, and its `restore-keys` prefix could never match it.
        uses: ./.github/actions/rcaeval-json
        with:
          mode: consume
      - name: Run ablation — RE3 only
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-ablation.ts --data-dir ~/RCAEval-json --suite re3 2>&1 | tee ablation-re3-results.txt
      - name: Upload ablation RE3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablation-re3-results
          path: |
            ablation-re3-results.txt
            ablation-results.json

  # ── L2 ranking-weight search (RCAEval, train/val/test) ──
  optimize-rcaeval:
    needs: [synthetic, artifact]
    if: inputs.scopes == '' || contains(inputs.scopes, 'optimize')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        # `consume`: the artifact must exist AND must state this checkout's bridge. A miss fails here
        # rather than letting the battery run against an absent directory and report an empty result
        # as a measurement. The key, the path and the trust live in the action, which derives the key
        # from the bridge itself -- the constant this replaced named nothing, at seven sites in this
        # file alone, and its `restore-keys` prefix could never match it.
        uses: ./.github/actions/rcaeval-json
        with:
          mode: consume
      - name: Run ranking-weight search (coordinate descent, train/val/test)
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          # No `--max-cases`: the corpus size has ONE owner, `OPTIMIZE_MAX_CASES` in
          # `benchmarks/src/optimize-population.ts` — `200`, the largest corpus this runner's heap holds. The
          # SPLIT would like `46 strata x 6 = 276`, and setting the cap to that requirement killed this job
          # with an OOM at 12 174 MB of a 12 288 MB heap; both numbers are printed by every run. This line
          # used to pass `200` as its own literal, and the CLI defaulted to `0` ("load everything").
          pnpm exec tsx benchmarks/src/run-optimize.ts --data-dir ~/RCAEval-json 2>&1 | tee optimize-rcaeval-results.txt
      - name: Upload weight-search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-rcaeval-results
          path: optimize-rcaeval-results.txt

  # ── Dashboard: combine all results, deploy to gh-pages ──
  dashboard:
    needs:
      [synthetic, rcaeval-re1, rcaeval-re2, rcaeval-re3, ablation-re1, ablation-re2, ablation-re3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download synthetic results
        uses: actions/download-artifact@v4
        with:
          name: synthetic-results
          path: artifacts/

      - name: Download RCAEval results
        uses: actions/download-artifact@v4
        with:
          pattern: rcaeval-re[1-3]-results
          path: artifacts/
        continue-on-error: true

      - name: Download ablation results
        uses: actions/download-artifact@v4
        with:
          pattern: ablation-re[1-3]-results
          path: artifacts/
        continue-on-error: true

      - name: Merge RCAEval results
        run: |
          echo "=== RCAEval RE1 ===" > artifacts/rcaeval-results.txt
          cat artifacts/rcaeval-re1-results/rcaeval-re1-results.txt 2>/dev/null >> artifacts/rcaeval-results.txt || echo "(not available)" >> artifacts/rcaeval-results.txt
          echo "" >> artifacts/rcaeval-results.txt
          echo "=== RCAEval RE2 ===" >> artifacts/rcaeval-results.txt
          cat artifacts/rcaeval-re2-results/rcaeval-re2-results.txt 2>/dev/null >> artifacts/rcaeval-results.txt || echo "(not available)" >> artifacts/rcaeval-results.txt
          echo "" >> artifacts/rcaeval-results.txt
          echo "=== RCAEval RE3 ===" >> artifacts/rcaeval-results.txt
          cat artifacts/rcaeval-re3-results/rcaeval-re3-results.txt 2>/dev/null >> artifacts/rcaeval-results.txt || echo "(not available)" >> artifacts/rcaeval-results.txt

      - name: Merge ablation results
        run: |
          echo "=== Ablation RE1 ===" > artifacts/ablation-results.txt
          cat artifacts/ablation-re1-results/ablation-re1-results.txt 2>/dev/null >> artifacts/ablation-results.txt || echo "(not available)" >> artifacts/ablation-results.txt
          echo "" >> artifacts/ablation-results.txt
          echo "=== Ablation RE2 ===" >> artifacts/ablation-results.txt
          cat artifacts/ablation-re2-results/ablation-re2-results.txt 2>/dev/null >> artifacts/ablation-results.txt || echo "(not available)" >> artifacts/ablation-results.txt
          echo "" >> artifacts/ablation-results.txt
          echo "=== Ablation RE3 ===" >> artifacts/ablation-results.txt
          cat artifacts/ablation-re3-results/ablation-re3-results.txt 2>/dev/null >> artifacts/ablation-results.txt || echo "(not available)" >> artifacts/ablation-results.txt

      - name: Generate HTML dashboard
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone

          synthetic_file = 'artifacts/synthetic-results/benchmark-results.json'
          rcaeval_file = 'artifacts/rcaeval-results.txt'
          ablation_file = 'artifacts/ablation-results.txt'

          synthetic_list = json.load(open(synthetic_file)) if os.path.exists(synthetic_file) else []
          synthetic = synthetic_list if isinstance(synthetic_list, list) else [{'name':'N/A','value':'N/A','unit':''}]
          rcaeval_raw = open(rcaeval_file).read() if os.path.exists(rcaeval_file) else 'RCAEval results not available (data cache miss or benchmark failed)'
          ablation_raw = open(ablation_file).read() if os.path.exists(ablation_file) else 'Ablation study not available (requires successful RCAEval)'

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          sha = os.environ.get('GITHUB_SHA', 'unknown')[:8]
          run_id = os.environ.get('GITHUB_RUN_ID', '?')

          synthetic_rows = '\n'.join([
              f'<tr><td>{m.get(\"name\",\"?\")}</td><td>{m.get(\"value\",\"?\")}</td><td>{m.get(\"unit\",\"\")}</td></tr>'
              for m in synthetic
          ])

          html = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
          <meta charset=\"UTF-8\">
          <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
          <title>Micro-Kinetic Benchmark Dashboard</title>
          <style>
            * {{ margin: 0; padding: 0; box-sizing: border-box; }}
            body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 20px; }}
            .container {{ max-width: 1400px; margin: 0 auto; }}
            h1 {{ color: #58a6ff; font-size: 2em; border-bottom: 2px solid #30363d; padding-bottom: 12px; margin-bottom: 20px; }}
            h2 {{ color: #f0883e; margin: 30px 0 15px; font-size: 1.5em; }}
            .meta {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px; font-size: 0.9em; }}
            .meta span {{ color: #8b949e; }}
            .meta strong {{ color: #58a6ff; }}
            table {{ width: 100%; border-collapse: collapse; margin: 10px 0 20px; background: #161b22; border-radius: 8px; overflow: hidden; }}
            th, td {{ padding: 10px 14px; text-align: left; border: 1px solid #21262d; }}
            th {{ background: #1f2937; color: #58a6ff; font-weight: 600; }}
            tr:hover {{ background: #1c2129; }}
            pre {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; overflow-x: auto; font-size: 0.85em; }}
          </style>
          </head>
          <body>
          <div class=\"container\">
          <h1>⚡ Micro-Kinetic Benchmark Dashboard</h1>
          <div class=\"meta\">
            <strong>Commit:</strong> {sha} &nbsp;|&nbsp;
            <strong>Run:</strong> <a href=\"https://github.com/AgentiX-E/micro-kinetic-ts/actions/runs/{run_id}\" style=\"color:#58a6ff\">#{run_id}</a> &nbsp;|&nbsp;
            <strong>Time:</strong> {now}
          </div>

          <h2>📊 Synthetic Benchmark (175 cases, 6 fault types)</h2>
          <table>
            <tr><th>Metric</th><th>Value</th><th>Unit</th></tr>
            {synthetic_rows}
          </table>

          <h2>🎯 RCAEval Real Dataset (RE1/RE2/RE3 — parallel)</h2>
          <pre>{rcaeval_raw}</pre>

          <h2>🔬 Feature Ablation Study (10 configs × 3 reps, per suite)</h2>
          <pre>{ablation_raw}</pre>

          <p style=\"text-align:center;color:#8b949e;margin-top:40px;font-size:0.8em\">
            Powered by AgentiX-E Micro-Kinetic &middot; Deng Yu Kinetic Theory &middot; Parallel runners (RE1/RE2/RE3) &middot; Auto-generated by CI
          </p>
          </div>
          </body>
          </html>'''

          with open('index.html', 'w') as f:
              f.write(html)
          print('Dashboard generated: index.html')
          "

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dashboard
          path: |
            index.html
            artifacts/synthetic-results/benchmark-results.json
            artifacts/rcaeval-results.txt
            artifacts/ablation-results.txt

      - name: Post summary
        if: always()
        run: |
          echo '## Micro-Kinetic Synthetic Benchmark' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/synthetic-results/benchmark-results.json ]; then
            cat artifacts/synthetic-results/benchmark-results.json >> $GITHUB_STEP_SUMMARY
          else
            echo 'No synthetic results available' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## RCAEval Real Dataset Benchmark (Parallel RE1/RE2/RE3)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/rcaeval-results.txt ]; then
            cat artifacts/rcaeval-results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'No RCAEval results' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## Feature Ablation Study' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/ablation-results.txt ]; then
            cat artifacts/ablation-results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'No ablation results' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          destination_dir: benchmark
