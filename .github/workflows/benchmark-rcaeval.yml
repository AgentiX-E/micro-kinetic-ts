name: Benchmark — RCAEval Full Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-rcaeval.yml'
      - 'packages/**/src/**'
      - 'benchmarks/src/**'
      - 'benchmarks/src/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore cached RCAEval datasets
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/RCAEval-data
          key: RCAEval-datasets-v2-pq
          restore-keys: |
            RCAEval-datasets-

      - name: Verify dataset availability
        run: |
          TOTAL_FILES=$(find ~/RCAEval-data -type f 2>/dev/null | wc -l)
          PARQUET_FILES=$(find ~/RCAEval-data -name '*.parquet' 2>/dev/null | wc -l)
          echo "Total files: $TOTAL_FILES"
          echo "Parquet files: $PARQUET_FILES"
          if [ "$TOTAL_FILES" -lt 50 ]; then
            echo "::warning::Insufficient cached files ($TOTAL_FILES). Run Cache Datasets workflow first."
          fi
          find ~/RCAEval-data -maxdepth 2 -type d 2>/dev/null | head -20

      - name: Convert Parquet to RCAEval JSON (pandas bridge)
        run: |
          pip install pandas pyarrow 2>/dev/null || true
          python3 -c "
          import os, json
          from pathlib import Path
          import pandas as pd

          cache_dir = os.path.expanduser('~/RCAEval-data')
          out_dir = os.path.expanduser('~/RCAEval-json')
          os.makedirs(out_dir, exist_ok=True)

          case_dirs = set()
          for pq in Path(cache_dir).rglob('*.parquet'):
              case_dirs.add(pq.relative_to(cache_dir).parent)

          print(f'Found {len(case_dirs)} case directories')
          converted = 0

          for case_rel in sorted(case_dirs):
              case_src = Path(cache_dir) / case_rel
              case_dst = Path(out_dir) / case_rel
              os.makedirs(case_dst, exist_ok=True)

              try:
                  metrics_pq = case_src / 'metrics.parquet'
                  if metrics_pq.exists():
                      df = pd.read_parquet(metrics_pq)
                      metrics_out = {}
                      first_col = str(df.columns[0]) if len(df.columns) > 0 else ''

                      if 'service' in df.columns or 'service_id' in df.columns:
                          svc_col = next((c for c in df.columns if c in ('service', 'service_id', 'serviceId')), df.columns[0])
                          ts_col = next((c for c in df.columns if c in ('timestamp', 'time', 'ts')), None)
                          val_col = next((c for c in df.columns if c in ('value', 'val')), None)
                          metric_col = next((c for c in df.columns if c in ('metric_name', 'metric', 'name')), None)
                          for _, row in df.iterrows():
                              svc = str(row[svc_col])
                              if svc not in metrics_out: metrics_out[svc] = []
                              metrics_out[svc].append({
                                  'timestamp': int(row[ts_col]) if ts_col and ts_col in row else 0,
                                  'value': float(row[val_col]) if val_col and val_col in row else 0.0,
                                  'metric_name': str(row[metric_col]) if metric_col and metric_col in row else '',
                              })
                      else:
                          ts_vals = df.iloc[:, 0].tolist() if len(df.columns) > 0 else []
                          for col in df.columns[1:]:
                              col_str = str(col)
                              parts = col_str.split('::') if '::' in col_str else col_str.rsplit('_', 1)
                              svc = parts[0] if len(parts) >= 1 else col_str
                              metric = parts[1] if len(parts) >= 2 else col_str
                              for idx, val in enumerate(df[col]):
                                  ts = int(ts_vals[idx]) if idx < len(ts_vals) else 0
                                  if svc not in metrics_out: metrics_out[svc] = []
                                  metrics_out[svc].append({
                                      'timestamp': ts,
                                      'value': float(val) if pd.notna(val) else 0.0,
                                      'metric_name': metric,
                                  })
                      with open(case_dst / 'metrics.json', 'w') as f:
                          json.dump(metrics_out, f)

                  inject_pq = case_src / 'inject_time.parquet'
                  inject_txt = case_src / 'inject_time.txt'
                  if inject_pq.exists():
                      df = pd.read_parquet(inject_pq)
                      val = int(df.iloc[0, 0]) if len(df) > 0 else 0
                      (case_dst / 'inject_time.txt').write_text(str(val))
                  elif inject_txt.exists():
                      import shutil; shutil.copy(inject_txt, case_dst / 'inject_time.txt')

                  for gt_name in ['ground_truth.json', 'ground_truth.parquet']:
                      gt_src = case_src / gt_name
                      if gt_src.exists():
                          if gt_src.suffix == '.parquet':
                              df = pd.read_parquet(gt_src)
                              gt_data = df.iloc[0].to_dict() if len(df) > 0 else {}
                              with open(case_dst / 'ground_truth.json', 'w') as f:
                                  json.dump(gt_data, f, default=str)
                          else:
                              import shutil; shutil.copy(gt_src, case_dst / 'ground_truth.json')
                          break

                  # ── Convert traces.parquet → traces.csv (RE2/RE3) ──
                  traces_pq = case_src / 'traces.parquet'
                  if traces_pq.exists():
                      df = pd.read_parquet(traces_pq)
                      df.to_csv(case_dst / 'traces.csv', index=False)

                  # ── Convert logs.parquet → logs.csv (RE2/RE3) ──
                  logs_pq = case_src / 'logs.parquet'
                  if logs_pq.exists():
                      df = pd.read_parquet(logs_pq)
                      df.to_csv(case_dst / 'logs.csv', index=False)

                  for aux_file in case_src.glob('*'):
                      if aux_file.suffix in ['.csv', '.txt'] and aux_file.name not in ['metrics.parquet', 'inject_time.parquet']:
                          import shutil; shutil.copy(aux_file, case_dst / aux_file.name)

                  converted += 1
              except Exception as e:
                  print(f'  Skip {case_rel}: {e}')

          print(f'Converted {converted}/{len(case_dirs)} case directories to JSON at {out_dir}')
          "

      - name: Verify converted JSON
        run: |
          JSON_COUNT=$(find ~/RCAEval-json -name '*.json' 2>/dev/null | wc -l)
          TRACE_COUNT=$(find ~/RCAEval-json -name 'traces.csv' 2>/dev/null | wc -l)
          LOG_COUNT=$(find ~/RCAEval-json -name 'logs.csv' 2>/dev/null | wc -l)
          echo "JSON files available: $JSON_COUNT"
          echo "Trace files available: $TRACE_COUNT"
          echo "Log files available: $LOG_COUNT"
          find ~/RCAEval-json -maxdepth 3 -type d 2>/dev/null | head -20

      - name: Run Micro-Kinetic benchmark (synthetic + classifier)
        run: |
          pnpm exec tsx benchmarks/src/run-all.ts --cases 175 --output benchmark-results.json

      - name: Run RCAEval industry-standard benchmark
        run: |
          pnpm exec tsx benchmarks/src/run-rcaeval.ts 2>&1 | tee rcaeval-results.txt

      - name: Generate HTML dashboard
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone

          synthetic = json.load(open('benchmark-results.json'))
          rcaeval_raw = open('rcaeval-results.txt').read() if os.path.exists('rcaeval-results.txt') else 'Not available (cache miss)'

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          sha = os.environ.get('GITHUB_SHA', 'unknown')[:8]
          run_id = os.environ.get('GITHUB_RUN_ID', '?')

          synthetic_rows = '\n'.join([
              f'<tr><td>{m[\"name\"]}</td><td>{m[\"value\"]}</td><td>{m[\"unit\"]}</td></tr>'
              for m in synthetic
          ])

          html = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
          <meta charset=\"UTF-8\">
          <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
          <title>Micro-Kinetic Benchmark Dashboard</title>
          <style>
            * {{ margin: 0; padding: 0; box-sizing: border-box; }}
            body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 20px; }}
            .container {{ max-width: 1400px; margin: 0 auto; }}
            h1 {{ color: #58a6ff; font-size: 2em; border-bottom: 2px solid #30363d; padding-bottom: 12px; margin-bottom: 20px; }}
            h2 {{ color: #f0883e; margin: 30px 0 15px; font-size: 1.5em; }}
            h3 {{ color: #7ee787; margin: 20px 0 10px; }}
            .meta {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px; font-size: 0.9em; }}
            .meta span {{ color: #8b949e; }}
            .meta strong {{ color: #58a6ff; }}
            table {{ width: 100%; border-collapse: collapse; margin: 10px 0 20px; background: #161b22; border-radius: 8px; overflow: hidden; }}
            th, td {{ padding: 10px 14px; text-align: left; border: 1px solid #21262d; }}
            th {{ background: #1f2937; color: #58a6ff; font-weight: 600; }}
            tr:hover {{ background: #1c2129; }}
            .score-100 {{ background: #0e4429; color: #7ee787; }}
            .score-90 {{ background: #0e4429; color: #7ee787; }}
            .score-80 {{ background: #1b3a1b; color: #56d364; }}
            .score-60 {{ background: #5c3a00; color: #d29922; }}
            .score-low {{ background: #490202; color: #f85149; }}
            pre {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; overflow-x: auto; font-size: 0.85em; }}
            .pass {{ color: #7ee787; }} .fail {{ color: #f85149; }}
            .grid-2 {{ display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }}
            @media (max-width: 900px) {{ .grid-2 {{ grid-template-columns: 1fr; }} }}
          </style>
          </head>
          <body>
          <div class=\"container\">
          <h1> Micro-Kinetic Benchmark Dashboard</h1>
          <div class=\"meta\">
            <strong>Commit:</strong> {sha} &nbsp;|&nbsp;
            <strong>Run:</strong> <a href=\"https://github.com/AgentiX-E/micro-kinetic-ts/actions/runs/{run_id}\" style=\"color:#58a6ff\">#{run_id}</a> &nbsp;|&nbsp;
            <strong>Time:</strong> {now}
          </div>

          <h2> Synthetic Benchmark (175 cases, 6 fault types)</h2>
          <table>
            <tr><th>Metric</th><th>Value</th><th>Unit</th></tr>
            {synthetic_rows}
          </table>

          <h2> RCAEval Real Dataset (per-system, per-dataset)</h2>
          <pre>{rcaeval_raw}</pre>

          <p style=\"text-align:center;color:#8b949e;margin-top:40px;font-size:0.8em\">
            Powered by AgentiX-E Micro-Kinetic &middot; Deng Yu Kinetic Theory &middot; Auto-generated by CI
          </p>
          </div>
          </body>
          </html>'''

          with open('index.html', 'w') as f:
              f.write(html)
          print('Dashboard generated: index.html')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            rcaeval-results.txt
            index.html

      - name: Post summary
        run: |
          echo '## Micro-Kinetic Synthetic Benchmark' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## RCAEval Real Dataset Benchmark (per-system, per-dataset)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f rcaeval-results.txt ]; then
            cat rcaeval-results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'No RCAEval results (cache miss)' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          destination_dir: benchmark
