name: Benchmark — Routing Probe (engine vs PRISM)

# Readback workflow for the per-context routing feasibility probe. On the SAME
# loaded cases, the deterministic engine (golden config) and the PRISM
# graph-free baseline (arXiv:2601.21359) each produce a per-case top-1/top-2
# ranking with scores (the engine's `finalScore`, PRISM's M-score). The probe
# emits one record per case so the offline analysis can derive the
# zero-regression routing frontier — the set of routers that never make any
# (system × fault-type) cell worse than the always-engine baseline.
#
# The engine CLI computes PRISM inline on the identical BenchmarkCase objects it
# analyzes, so both engines are compared on exactly the same case set. Each
# suite is a separate parallel job (matching the golden-baseline case counts and
# per-suite production flags), and the three JSON payloads are merged locally
# after readback with benchmarks/src/merge-routing-probe.ts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rcaeval-re1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Run routing probe — RE1
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re1 --routing-probe routing-probe-re1.json 2>&1 | tee rcaeval-re1-results.txt
      - name: Upload RE1 routing-probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-probe-re1
          path: |
            routing-probe-re1.json
            rcaeval-re1-results.txt

  rcaeval-re2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Run routing probe — RE2
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re2 --max-cases 50 --routing-probe routing-probe-re2.json 2>&1 | tee rcaeval-re2-results.txt
      - name: Upload RE2 routing-probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-probe-re2
          path: |
            routing-probe-re2.json
            rcaeval-re2-results.txt

  rcaeval-re3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Run routing probe — RE3
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-rcaeval.ts --suite re3 --trace-weight 1 --routing-probe routing-probe-re3.json 2>&1 | tee rcaeval-re3-results.txt
      - name: Upload RE3 routing-probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-probe-re3
          path: |
            routing-probe-re3.json
            rcaeval-re3-results.txt
