name: Benchmark — agentic elimination study

# The elimination layer's measurement line, run where the corpus and the keys already are.
#
# ## Why this is a workflow and not a local script
#
# The corpus is 1 422 datapacks whose CONVERTED form is the artifact a run needs, and that artifact is
# hosted as release assets on `AgentiX-E/rcabench-data` (see `.github/actions/rcabench-shards`). A
# development machine therefore has to hold ~19 GB of derived data to reproduce one number, while a
# runner holds it for the length of a job and throws it away. The same is true of the model arm, whose
# key lives in `secrets` and must not be anywhere else. Measurement belongs where the inputs are.
#
# ## Why it is a SEPARATE workflow rather than two more inputs on `fse26-benchmark.yml`
#
# That file declares exactly 25 dispatch inputs, which is the hard `workflow_dispatch` limit, and
# `dispatch-surface-census.test.ts` pins the count as an exact 25 with the reason recorded: `terms_dump`
# took the last slot, so "the NEXT axis cannot be a new input". The study needs three artifact flags
# (`--fingerprint-out`, `--per-case-out`, `--fault-free-profile`) that no dispatch of that file can
# state. Splitting the workflow rather than evicting a knob from the ranking surface is the choice that
# leaves the published surface alone; a knob removed to make room would be an axis nobody could dispatch.
#
# ## Why a RANKING DEPTH artifact, when `Top@1` and `Top@5` are already reported
#
# Because the two misses they leave are different problems. A case the engine ranked sixth is a case a re-ranking
# of a wider presentation could recover; a case whose answer appears nowhere in the order is one no re-ranking can
# reach, because the graph does not carry it. `85.5 %`-versus-`93.8 %` cannot separate them, and which one dominates
# is the question that decides whether the next iteration spends on scoring or on graph construction. So `measure`
# writes the first-hit depth in the order the engine actually sorted, one compact row per case, and `study` prints
# the cumulative `recall@K` ladder and the per-family split before it scores any arm — a ceiling quoted over a
# population whose misses are mostly absent would be describing headroom this layer cannot collect.
#
# It costs a second ranking pass per case (the depth needs every candidate, not the reported five), which is the
# same price `--terms-dump` charges and the reason both are opt-in flags rather than defaults in the runner.
#
# ## What it produces, and the boundary that makes it checkable
#
# Job `measure` writes four artifacts: the elimination fingerprints (every candidate's channel
# pre/post/band/rate, ~5 MB), the per-case verdict file, the ranking-depth rows (one line per case, with the head of
# the order and the scores the sort used), and the run's own report. Job `study` reads
# ONLY those artifacts and re-scores them offline. That boundary is deliberate: the study has no access
# to the corpus, so a number it prints cannot be an accident of the data it happened to load, and the
# same artifacts re-scored under a different `weight` cost nothing at all — which is what makes the
# control arm (`weight=0`) free rather than a second 25-minute run.
#
# ## What is NOT cached here, and the measurement behind it
#
# `GET /repos/AgentiX-E/micro-kinetic-ts/actions/cache/usage` reports 10 743 940 592 bytes against a
# 10 GB budget across 84 entries -- 80 `codeql-overlay-base-database-*` pairs (5 686 MB, one per commit
# SHA) and one `RCAEvalJSON-*` (3 952 MB) that every push-triggered RCAEval battery reads. The budget is
# over quota, so every save evicts something: a 2.5 GB shard cache would evict a 3.9 GB artifact that
# costs ~30 minutes to rebuild, to save a download this organisation's own release assets serve in about
# a minute. `.github/workflows/cache-prune.yml` reclaims the dead per-SHA entries instead, and the
# converted corpus stays on a release, which has no budget and no eviction and carries a digest.
#
# The two remaining candidates are treated differently, and both by measurement:
#
# * **the shards are not cached.** A cache hit would save the 114 s the download step takes in run
#   `43055506630` (16:09:45 -> 16:11:39), at the cost of 2.5 GB of a budget that is already over its
#   quota -- so the entry would be paid for by evicting the 3.9 GB RCAEval artifact. A cache that
#   wins 114 s and loses 30 minutes is not a cache.
# * **the fault-free profile is cached.** It costs 6 m 46 s to build (711 cases, measured) and writes
#   437 KB, and its key is derived from the corpus digest times a digest of every source file the
#   build reads, so a hit cannot be stale by construction.

on:
  workflow_dispatch:
    inputs:
      shard_tag:
        description: "rcabench-data release tag holding the shards (never `latest`). EMPTY = resolve it from this checkout's converter digest, which is the only property that identifies a usable cache: the action lists every released cache, reads its manifest digest, and selects the one this converter produced (refusing when none or several match). An explicit tag PINS the cache and is still refused by the provenance gate unless its manifest was built from this checkout"
        required: false
        default: ''
      categories:
        description: 'Comma-separated fault categories to download (empty = all 7). A subset is a SCOPE, not a smaller corpus: a category that was not downloaded cannot report anything at all'
        required: false
        default: ''
      max_cases:
        description: 'Number of datapacks to evaluate (empty = the runner default, which is all downloaded). Passed only when non-empty, because the runner owns its default'
        required: false
        default: ''
      containment_order:
        description: 'The containment pass: a caller may not outrank a callee whose own latency excursion is larger. This is the only workflow that can state it, because the pass needs the fault-free profile and this is the only workflow that BUILDS one -- the benchmark surface refuses `--fault-free-profile` by name so a dispatch cannot name a stale band. Empty = the engine default, which has been ON since iteration 293 once the failed-interface requirement was in place; 1 = on, 0 = off (the arm §12 refused: 33 gains against 5 losses, where the gated arm reads 15 against 0). Measured on the FSE 26 corpus by two dispatches at 1 and 0 before that requirement: 47 gains, 5 losses, 75.457 to 78.411 percent Top@1 -- see docs/containment-order.md §4 and §12.2'
        required: false
        default: ''
      weight:
        description: "Elimination weight the study applies to a recorded claim (empty = the study's own default, which is 1). It is a POST-processing parameter: the same fingerprints re-scored at 0 are the control arm, so a weight sweep costs no run and no tokens"
        required: false
        default: ''
      model:
        description: 'Model the eliminator is asked as. It is an input rather than a constant because the published 2026 tables separate models by more than they separate frameworks, so the arm has to be measurable per model'
        required: false
        default: 'deepseek-chat'
      # ── The presentation-width arm ────────────────────────────────────────────────────────────────────────────
      #
      #   Widens the ELIMINATION FINGERPRINT and nothing else: the run''s published ranking stays at the five the
      #   engine publishes, so `Top@1`, `Top@3`, `Top@5` and every number in `docs/sota-comparison.md` are computed
      #   from the same five-wide answer whichever value is dispatched. That is the property that makes the arm
      #   interpretable — it varies the window the model is shown, and the engine is held fixed.
      #
      #   The nomination step reads the same number as `--max-candidates`, so one input states one window. Empty =
      #   the shipped five. `0` is legal here (every candidate) and is NOT forwarded to the nomination step,
      #   whose parser has no such sentinel.
      fingerprint_top_k:
        description: 'How many candidates the elimination fingerprint carries, and therefore how wide a table the model is shown (empty = 5, the width the run publishes; 0 = every candidate, measure only)'
        required: false
        default: ''
      # ── The promotion gate ────────────────────────────────────────────────────────────────────────────────────
      #
      #   `off` is the control and is a WORD rather than a number, because `Number('off')` is NaN and the two
      #   spellings have to be told apart explicitly or a control would be refused as a malformed threshold.
      #   A number sets the gate''s band as a fraction of the case''s own spread over the FULL scored order; the
      #   spread comes from the terms dump this workflow now writes, which is why the threshold and the dump are
      #   dispatched together. See `docs/agentic-promotion-gate.md` for the registered reading at 0.03.
      promotion:
        description: "Promotion gate threshold as a fraction of the case's own spread (empty = the gate is not consulted, `off` = the explicit control, a number in (0,1) = the arm)"
        required: false
        default: ''
      # ── The topology brief: what the model is TOLD ───────────────────────────────────────────────────────────
      #
      #   `fingerprint_top_k` widens the TABLE; this states the GRAPH. `auto` derives one brief per corpus from
      #   the union of every case''s call graph, at measure time, and stages it beside the dumps. It is ONE string
      #   for the whole population by construction, and that constancy is the guard rather than a budget: a text
      #   that differed by case would be a per-case input, and a per-case input can carry the answer without ever
      #   printing it. The digest changes, so a run with the brief on cannot reuse a claim recorded with it off.
      #
      #   `auto` is the only value implemented. A hand-written document is the paper''s own shape and a DIFFERENT
      #   arm with its own provenance argument (`preregistration-306.md`), so the study step REFUSES any other
      #   non-empty value rather than deriving one under a name that promised another.
      # ── The free-investigation arm ────────────────────────────────────────────────────────────────────────────
      #
      #   Every arm in this workflow shows the model a TABLE and asks it to choose. `arXiv:2608.21310`'s ten-
      #   configuration table prices that shape at 45.8 % Acc@1 for the pre-extracted-feature design and 77.6-90.0 %
      #   for the adaptive ones, and `RCAtlas` reports the same ordering from the other side (65-77 % PR@1 for
      #   harnesses that prescribe none of the model's calls, 16-53 % for five that do). This input runs the shape
      #   those two papers put on top: five retrieval tools over the case's own telemetry and a terminal answer.
      #
      #   The number is a SAMPLE SIZE PER STRATUM, not a case count: the arm pays roughly six rounds per case, so a
      #   full corpus is a different purchase from a 200-case pass, and the two strata are sampled because the
      #   quantities that decide the arm are REPAIRS and BREAKS against the engine on the same cases.
      query_agent_sample:
        description: 'Run the free-investigation arm on this many engine-misses AND this many engine-hits (empty = do not run; the arm costs tokens per case)'
        required: false
        default: ''
      query_max_rounds:
        description: 'Rounds the free-investigation arm may take per case (empty = the runner default, 6). The 6 is what the first pilot spent in FULL on all 160 cases while answering 5 of them, so this input exists to separate "the arm needs more turns" from "the arm never knew it had to answer" — a budget axis the artifact could not state until now'
        required: false
        default: ''
      query_max_tool_calls:
        description: 'Tool calls the free-investigation arm may EXECUTE per case (empty = the runner default, 10). A corpus case carries ~50 services and each single-service tool spends one call on one of them, so this is the width of the investigation and the axis `TOOL fleet` was added against'
        required: false
        default: ''
      query_seed:
        description: "Which order to show the free-investigation arm BEFORE its first turn: `engine` = the engine's own top-5 (a prior, and the arm's floor becomes the engine's accuracy) or empty/`none` = a free arm, whose first sight of the case is its first tool call. The two arms have different floors, so this is an ablation switch and not a quality knob"
        required: false
        default: ''
      query_fallback:
        description: "What a REFUSED override settles on, and which name the gate defends: `seed` (the default) = the same order the arm shows, which is every arm measured before this input existed; `engine` = the engine's own top-5 order's first name even when the prompt showed nothing, which is the arm a product with an engine underneath actually has; `none` = no fallback, so an arm that shows no prior answers nothing the gate admits and scores what it investigated. The two decisions this separates are what the arm SHOWS (`query_seed`) and what it FALLS BACK TO: a free investigation that could not ship the engine's answer was measuring the harness's wiring rather than the model"
        required: false
        default: ''
      query_gate:
        description: "What an OVERRIDE of the prior must show before it is accepted: `cited` = the investigation executed a query about the service it names, `cone` = that plus the service sitting on the prior's callee side, `contrast` = that plus the candidate's OWN telemetry showing it LEADS the prior (the interface prior->X failed, or X logged its first error earlier — the lag axis of arXiv 10.1145/3803437.3805219), `lag` = that plus ONLY the order axis (X's first error strictly earlier), because the 160-case pricing found the interface axis admits the prior's own victims and bought 1 repair with 4 breaks, empty/`none` = ungated (the surface iteration 318 measured, where the model overrode 55% of cases at precision 0.263). A refused override falls back to the prior, so the gated arm cannot score below the engine by refusing — only by admitting a wrong edit. `arXiv:2611.05390` prices the mechanism: an evidence gate cuts corruption of correct proposals while keeping most repairs, and a gate whose rule lives only in the prompt does not hold"
        required: false
        default: ''
      query_resolve:
        description: "Whether a SETTLED answer is re-read after the gate: `entry-prior` = attribute the failure to the service requests enter through when nothing below it raised an error rate and the answer's own non-symptom channels stayed under 300 units of its pre-window spread; `edge-novel` = that rule PLUS the interface witness first: answer with the caller of the interface that carried a request SHAPE its callee had never seen, skipping the traffic generator, which is a root of the call graph and never a label. empty/`none` = the arm as iterations 318-321 shipped it. Needs no model call and no second dispatch, because both are second readers of evidence the case already carries. Iteration 323's second rule (a service that LOST traffic is a victim) is refuted and is not shipped: every case in this corpus has one, so it localises nothing"
        required: false
        default: ''
      topology_brief:
        description: "Carry a corpus topology brief in the nomination prompt: `auto` = derive it from this corpus's own call graphs (empty = off; any other value is refused, because a hand-written document is a different arm)"
        required: false
        default: ''
      query_channel_split:
        description: "Price the channel split over the corpus after the arm: walk every case once, write each service's resource/traffic/other departure profile, and print the two-fold cross-validation of the bar that decides whether an answer whose departure lives only in the traffic channel is a conduit rather than a source. Costs NO model call — it re-reads evidence the case already carries — and ~25 minutes of walk. Off by default because a dispatch that is not asking this question should not pay for it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    name: measure (engine + elimination dumps)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      #   The key is materialised once, exactly as the study job does, because a `secrets` context is not readable
      #   from a step's `if`. Measured here rather than there because the free-investigation arm needs the CORPUS
      #   on disk, and the corpus is this job's; the study job has the key and not the corpus.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HAS_MODEL_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # The corpus, through the one action that owns which released cache is consumable, where it is
      # extracted and what proves it came from this converter. A second copy of those three steps is
      # how a provenance gate ends up enforced in one workflow and skipped in another.
      - name: Fetch the converted corpus
        id: corpus
        uses: ./.github/actions/rcabench-shards
        with:
          tag: ${{ inputs.shard_tag }}
          categories: ${{ inputs.categories }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The elimination fingerprint IS a fault-free band per channel, so the dump cannot be produced
      # without the profile — `run-fse26.ts` refuses the flag by name rather than writing a file of
      # empty candidate lists, which would read as "no verifiable claim" about the corpus instead of
      # about that run. Built over the WHOLE corpus rather than the `max_cases` scope, because the
      # profile is a property of the corpus and an arm that rebuilt it per scope could not be compared
      # with an arm that read it.
      #
      #   It is also the one step in this job worth caching, and the only one: measured at **6 m 46 s**
      #   for 711 cases here, so ~20 minutes for the full corpus, for a 437 KB output. The key is
      #   DERIVED rather than typed -- the converter digest (which corpus) times a digest of every
      #   `.ts` file the build reads (which builder) -- because a hand-written key is the defect
      #   `cache-datasets.yml` records: `2b15f6e` fixed the conversion pipeline, hit the cache the OLD
      #   pipeline had produced, and converted nothing while the step read `skipped`.
      #
      #   It is an ACTION rather than four steps here, because the FSE'26 benchmark surface is now the
      #   second consumer and the two must not be able to drift: that surface's published cell was measured
      #   at 80.24 % with the pass inert (no profile) against 81.29 % with it speaking on the same corpus
      #   (register §314), so both workflows ask the same owner for the same artifact.
      - name: Build the fault-free profile
        uses: ./.github/actions/rcabench-profile
        with:
          data-dir: $HOME/rcabench/json

      - name: Run the engine with the elimination dumps
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          mkdir -p artifacts/agentic
          #   The rule the other workflow earned the hard way: pass a flag only when its input is
          #   non-empty, so the runner's own default is the single owner of the configuration. An empty
          #   `--max-cases` parses to 0, which is "all" here but is "zero" in the flags whose parser has
          #   no such sentinel, so the safe form is the conditional one.
          MAX_CASES_ARG=()
          if [ -n "${{ inputs.max_cases }}" ]; then
            MAX_CASES_ARG=(--max-cases "${{ inputs.max_cases }}")
          fi
          #   `--fault-free-profile` is passed with the SHIPPED weight (0, `DEFAULT_FAULT_FREE_WEIGHT`),
          #   so it supplies the bands the dump records and changes no ranking term. A run that also
          #   passed `--fault-free-weight` would be measuring a different configuration than the one the
          #   standing document quotes.
          #   The containment pass needs the profile above and is inert without it, so this arm is the one place
          #   the pass can be measured: the benchmark surface refuses `--fault-free-profile` by name.
          CONTAINMENT_ARG=()
          if [ -n "${{ inputs.containment_order }}" ]; then
            if [ "${{ inputs.containment_order }}" = "1" ]; then
              CONTAINMENT_ARG=(--containment-order)
            else
              CONTAINMENT_ARG=(--no-containment-order)
            fi
          fi
          #   The fingerprint WIDTH, on the same conditional rule as `--max-cases`: the runner owns its own
          #   default, and an empty input must not become a flag. It widens an artifact and not the ranking, which
          #   is why it is safe for a dispatch to state it on a surface whose published numbers are quoted
          #   elsewhere -- the run's own `Top@1`/`Top@3`/`Top@5` are computed from the five-wide answer either way.
          #
          #   It travels WITH `--presentation-out`, in one array, because the parser refuses the one without the
          #   other and for a reason this run measured: `--fingerprint-out` is joined case by case against the
          #   verdict file by `headroom`, `ceiling` and `elimination`, so widening THAT file made the join
          #   disagree on 17 of 1 422 cases (run `44284042634`, study step 14). One file cannot carry two
          #   contracts; the wide one is a rendering and gets its own path.
          FINGERPRINT_WIDTH_ARG=()
          if [ -n "${{ inputs.fingerprint_top_k }}" ]; then
            FINGERPRINT_WIDTH_ARG=(--presentation-out artifacts/agentic/presentation.ndjson --fingerprint-top-k "${{ inputs.fingerprint_top_k }}")
          fi
          #   The TOPOLOGY brief. It is written here, not in `study`, because the call graph is built per case and
          #   released with it: no artifact this workflow uploads carries an edge, so a consumer could not derive
          #   the union without a second 25-minute corpus pass. `auto` is the only value implemented, and the
          #   refusal is here rather than in the runner so a dispatch that named a hand-written document fails
          #   before it spends 25 minutes measuring an arm it did not ask for.
          TOPOLOGY_ARG=()
          if [ -n "${{ inputs.topology_brief }}" ]; then
            if [ "${{ inputs.topology_brief }}" != "auto" ]; then
              echo "REFUSING: topology_brief=${{ inputs.topology_brief }} -- only 'auto' is implemented; a hand-written"
              echo "document is a different arm (preregistration-306.md) and would need its own provenance argument."
              exit 1
            fi
            TOPOLOGY_ARG=(--topology-brief-out artifacts/agentic/topology.ndjson)
          fi
          #   The TERMS dump is new here and it is what the promotion gate divides by. Its array order is the
          #   engine's answer at the width it was asked for, and the gate reads `full[0]`, `full[1]` and
          #   `min(score)` -- the answer, the margin and the denominator -- none of which the width of the
          #   PRESENTED list can move. A gate dispatched without this file is refused by the parser rather than
          #   scored against the fingerprint's own width, which is the defect `agentic-promotion-gate.md` §3
          #   records having made three times.
          pnpm exec tsx benchmarks/src/run-fse26.ts \
            --data-dir "$HOME/rcabench/json" \
            --fault-free-profile "$HOME/fault-free-profile.json" \
            --fingerprint-out artifacts/agentic/fingerprints.ndjson \
            --per-case-out artifacts/agentic/per-case.ndjson \
            --depth-out artifacts/agentic/depth.ndjson \
            --terms-dump artifacts/agentic/terms.ndjson \
            --containment-out artifacts/agentic/containment.ndjson \
            --output artifacts/agentic/results.json \
            "${CONTAINMENT_ARG[@]}" \
            "${FINGERPRINT_WIDTH_ARG[@]}" \
            "${TOPOLOGY_ARG[@]}" \
            "${MAX_CASES_ARG[@]}" 2>&1 | tee artifacts/agentic/results.txt
          echo "fingerprint lines: $(wc -l < artifacts/agentic/fingerprints.ndjson)"
          echo "verdict lines:     $(wc -l < artifacts/agentic/per-case.ndjson)"
          echo "depth lines:       $(wc -l < artifacts/agentic/depth.ndjson)"
          echo "terms lines:       $(wc -l < artifacts/agentic/terms.ndjson)"
          #   The presentation dump exists only when a width was asked for, and its line count is printed beside the
          #   published fingerprint's rather than instead of it: two dumps of one run are two artifacts, and a log
          #   that shows one count leaves a reader unable to tell a widened run from a default one.
          if [ -f artifacts/agentic/presentation.ndjson ]; then
            echo "presentation lines: $(wc -l < artifacts/agentic/presentation.ndjson)"
          fi
          #   The containment dump is the only artifact that can carry H2's population: ρ is a property of an EDGE
          #   over many cases, and a pair that was never inverted leaves no trace in the published answer. It is
          #   written at the SHIPPED depth (5), because that is the population every containment measurement in
          #   `docs/containment-order.md` was taken on — a dump at another depth would explain an arm nobody ran.
          echo "containment lines: $(wc -l < artifacts/agentic/containment.ndjson)"
          #   One line, because the brief is one record: the union of a corpus has one topology. A count of two
          #   would mean the flag ran twice into one path, and the reader refuses that rather than picking one.
          if [ -f artifacts/agentic/topology.ndjson ]; then
            echo "topology lines:    $(wc -l < artifacts/agentic/topology.ndjson)"
          fi

      # The corpus manifest is STAGED BESIDE THE DUMPS rather than uploaded from the workspace root.
      #   `upload-artifact` computes the least common ancestor of every path it is given, so one path outside
      #   `artifacts/agentic/` makes the artifact's root the workspace: the dumps then arrive at
      #   `artifacts/agentic/artifacts/agentic/…` and the study reads a file that is not there. Staging keeps
      #   every path under one root, which is the only thing that makes the artifact's layout a property of
      #   this list rather than of where each file happened to be written.
      - name: Stage the corpus manifest beside the dumps
        if: always()
        run: |
          mkdir -p artifacts/agentic
          if [ -f manifest.json ]; then
            cp manifest.json artifacts/agentic/manifest.json
          fi
          ls -l artifacts/agentic

      #   The arm runs AFTER the engine's verdicts exist, because its reading is PAIRED: what a free investigation
      #   repairs and what it breaks is measured against the engine on the same cases, and a sample drawn before the
      #   verdicts existed could not state either.
      - name: Free-investigation arm (sample)
        if: env.HAS_MODEL_KEY == 'true' && inputs.query_agent_sample != ''
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          # The budget is a dispatch input rather than a constant, because the first pilot spent the default in
          # full and answered 5 of 160 cases: whether that is a budget that is too small or a prompt that never
          # asked for an answer is a question only a second budget can separate.
          BUDGET_ARG=()
          if [ -n "${{ inputs.query_max_rounds }}" ]; then
            BUDGET_ARG+=(--max-rounds "${{ inputs.query_max_rounds }}")
          fi
          if [ -n "${{ inputs.query_max_tool_calls }}" ]; then
            BUDGET_ARG+=(--max-tool-calls "${{ inputs.query_max_tool_calls }}")
          fi
          # A seed is stated or it is absent: `none` is the free arm, and any other word is refused by the runner.
          SEED_ARG=()
          if [ -n "${{ inputs.query_seed }}" ]; then
            SEED_ARG+=(--seed "${{ inputs.query_seed }}")
          fi
          # A gate is a POLICY, and an unstated one is the ungated control rather than a default worth having. The
          # runner refuses an unknown value, so a typo cannot silently publish a gated reading no gate produced.
          GATE_ARG=()
          if [ -n "${{ inputs.query_gate }}" ]; then
            GATE_ARG+=(--gate "${{ inputs.query_gate }}")
          fi
          # A fallback, like a gate, is a surface the run STATES: an empty input leaves the runner's own default
          # (the order the arm shows), which is what every arm measured before this input carries.
          FALLBACK_ARG=()
          if [ -n "${{ inputs.query_fallback }}" ]; then
            FALLBACK_ARG+=(--fallback "${{ inputs.query_fallback }}")
          fi
          # A resolver, like a gate, is a rule the run STATES, and the runner refuses an unknown value.
          RESOLVE_ARG=()
          if [ -n "${{ inputs.query_resolve }}" ]; then
            RESOLVE_ARG+=(--resolve "${{ inputs.query_resolve }}")
          fi
          pnpm exec tsx benchmarks/src/run-query-agent.ts \
            --data-dir "$HOME/rcabench/json" \
            --verdicts artifacts/agentic/per-case.ndjson \
            --out artifacts/agentic/query-agent.ndjson \
            --model "${{ inputs.model }}" \
            --sample-misses "${{ inputs.query_agent_sample }}" \
            --sample-correct "${{ inputs.query_agent_sample }}" \
            "${BUDGET_ARG[@]}" \
            "${SEED_ARG[@]}" \
            "${GATE_ARG[@]}" \
            "${FALLBACK_ARG[@]}" \
            "${RESOLVE_ARG[@]}" \
            --concurrency 6 2>&1 | tee artifacts/agentic/query-agent.txt

      - name: Say why the free-investigation arm did not run
        if: env.HAS_MODEL_KEY != 'true' && inputs.query_agent_sample != ''
        run: |
          echo "::warning::DEEPSEEK_API_KEY is not available to this job, so the free-investigation arm was NOT MEASURED"
          echo "QUERY ARM NOT MEASURED: DEEPSEEK_API_KEY is not available to this job" \
            | tee artifacts/agentic/query-agent.txt

      - name: Price the channel split (corpus walk, no model call)
        # The corpus is already here and the answers are already in the arm's artifact, so the split's price is a
        # walk rather than a second arm. The walk runs WHETHER OR NOT an arm produced answers, because the profiles
        # are a property of the CORPUS: the first dispatch of this axis priced the rule and then threw the profiles
        # away, which made its zero re-readable only by walking again. A dispatch with no arm now writes the profiles
        # and prices nothing, and the later read is free.
        if: inputs.query_channel_split
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          ARTIFACT_ARG=()
          if [ -f artifacts/agentic/query-agent.ndjson ]; then
            ARTIFACT_ARG=(--artifact artifacts/agentic/query-agent.ndjson)
          else
            echo "::warning::query_channel_split was requested but the arm produced no artifact: profiles only"
          fi
          pnpm exec tsx benchmarks/src/run-channel-split.ts \
            --data-dir "$HOME/rcabench/json" \
            --channel-out artifacts/agentic/channel-profiles.ndjson \
            "${ARTIFACT_ARG[@]}" 2>&1 | tee artifacts/agentic/channel-split.txt

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-measure
          path: |
            artifacts/agentic/fingerprints.ndjson
            artifacts/agentic/presentation.ndjson
            artifacts/agentic/per-case.ndjson
            artifacts/agentic/depth.ndjson
            artifacts/agentic/terms.ndjson
            artifacts/agentic/containment.ndjson
            artifacts/agentic/topology.ndjson
            artifacts/agentic/results.txt
            artifacts/agentic/results.json
            artifacts/agentic/manifest.json
            artifacts/agentic/query-agent.ndjson
            artifacts/agentic/query-agent.txt
            artifacts/agentic/channel-profiles.ndjson
            artifacts/agentic/channel-split.txt
          if-no-files-found: warn

  study:
    name: study (offline re-scoring)
    needs: measure
    runs-on: ubuntu-latest
    #   A 1 422-case proposal at four calls in flight is about twenty-five minutes of wall clock on top of the
    #   re-scoring, and the two are one job because the scoring refuses to run on a claims file it did not just
    #   write. The bound is set where a job that hangs is still a failure rather than a bill.
    timeout-minutes: 120
    env:
      #   The key is put in the job's environment, never on a command line, and a step reads its PRESENCE through
      #   `HAS_MODEL_KEY` rather than the key itself: the `secrets` context is not available in a step's `if`, so
      #   the presence has to be materialised once and compared after.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HAS_MODEL_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Download the measurement
        uses: actions/download-artifact@v4
        with:
          name: agentic-measure
          path: artifacts/agentic

      - name: Show what arrived
        #   Printed before the study runs, so a failure names a missing file rather than a stack trace from a
        #   parser that was handed an empty path.
        run: ls -l artifacts/agentic

      # The split the elimination layer's own headroom rests on: a case the engine ranked too low is a case a
      # re-ranking could recover, and a case whose answer is nowhere in the order is one no re-ranking can reach.
      # `Top@1` and `Top@5` cannot tell them apart, so the depth artifact is read here, per family, and printed
      # before any arm is scored — a ceiling quoted over a population whose misses are mostly ABSENT would be
      # describing headroom no layer of this shape can collect.
      - name: Split the misses by depth and by family
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-depth-report.ts \
            --depth artifacts/agentic/depth.ndjson 2>&1 | tee artifacts/agentic/depth.txt

      # ── H2: the factorisation residual of a pair's out-of-band indicators ───────────────────────────────────
      #
      #   The question the interface requirement only answers crudely: "did anything pass between these two" is a
      #   count of failed calls, while ρ asks whether the two services' movements CO-MOVE more than independence
      #   predicts. The pre-registration fixed the bar before the data (`AUC > 0.8`), and the arm it is asked
      #   about is the one §12 refused — the excursions alone, without the failed-interface requirement.
      #
      #   Exit 3 is reserved for an EMPTY row file, which is an instrument failure. A population that cannot
      #   separate the two classes is a MEASUREMENT — it is what the kill criterion names — so it prints as FAIL
      #   and leaves the build green. Turning a refused hypothesis into a red job would make the next dispatch
      #   unable to tell a rejected arm from broken code.
      - name: Read the containment residual (H2)
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-containment-residual.ts \
            --rows artifacts/agentic/containment.ndjson \
            --per-case artifacts/agentic/per-case.ndjson \
            --output artifacts/agentic/containment-residual.json \
            2>&1 | tee artifacts/agentic/containment.txt
          {
            echo '### H2 — the factorisation residual'
            echo ''
            echo '```'
            #   The four line SHAPES the report prints, matched on their own prefixes: a pattern that required a
            #   colon after the em-dash rule matched nothing, and a summary that silently dropped the table it was
            #   quoting would look like a report with nothing in it.
            grep -E '^  (replay:|arm=|H2:)' artifacts/agentic/containment.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── H2's second criterion: the residual as the pass's requirement ──────────────────────────────────────
      #
      #   The first step asked whether ρ separates a gain from a loss. This one asks the only question that can
      #   turn the answer into behaviour: would REQUIRING ρ > 0, in place of the failed-interface record, make the
      #   containment pass better at +15 / −0 and a Top@1 above the shipped 1 156?
      #
      #   It is read cross-fitted, because a case that contributes its own indicators to an edge's residual and is
      #   then judged by it is graded on its own answer: each half of the corpus is gated by the prior fitted on
      #   the other, every case is gated exactly once, and both halves are then read together so the number stays
      #   comparable to the whole-corpus 1 156.
      #
      #   The shipped row is the INSTRUMENT CHECK, not a result. Its replay must reproduce the corpus's published
      #   number; a mismatch means the dump is missing an input, and the step exits 3 rather than report a
      #   residual row describing a walk the run never took. A measured PASS or FAIL leaves the job green: a
      #   refused hypothesis is not broken code.
      - name: Read the containment gate (H2, second criterion)
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-containment-gate.ts \
            --rows artifacts/agentic/containment.ndjson \
            --per-case artifacts/agentic/per-case.ndjson \
            --output artifacts/agentic/containment-gate.json \
            2>&1 | tee artifacts/agentic/containment-gate.txt
          {
            echo '### H2 — the residual as the requirement, cross-fitted'
            echo ''
            echo '```'
            grep -E '^  (rows=|prior |arm=|gate decisions:|criterion:|H2-gate:)' \
              artifacts/agentic/containment-gate.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── H6: the residual as a bounded TERM in the score ─────────────────────────────────────────────────────
      #
      #   The gate above spent the residual as a licence on one edge, which spends the same amount whether the
      #   fusion led by 0.01 or by 4. This step spends it proportionally — `score + λ·φ·a` on the callee of a
      #   qualifying pair — and reads four arms: the fusion baseline, the shipped interface record, the gate, and
      #   the term.
      #
      #   It is here rather than in a notebook because the answer is a REFUSAL and a refusal has to be re-read on
      #   every corpus: the arm reads +6/−10 at Top@1 1 137, and the reason is a census this step prints — the
      #   promotion's precision is 100 % at rank 2 and 0 for 20 at ranks 4 and 5. A future corpus that changes that
      #   table changes the conclusion, and nothing else in the pipeline would notice.
      #
      #   The λ sweep is printed in full because the pre-registration committed to the curve before the number
      #   existed. A single λ is a parameter; the curve is the smallest object that can tell a weight from a
      #   coincidence, and on this corpus it is one-to-one — a case bought for every case sold.
      #
      #   `--depth` is the same run's score dump. Joining the two dumps on `datapack` is a join INSIDE one
      #   artifact, and the CLI refuses a size mismatch rather than reading a smaller population.
      #
      #   Exit 3 is reserved for an artifact it cannot walk (a missing chain, a candidate with no score). A
      #   measured FAIL leaves the job green, on the same principle as the gate: a refused hypothesis is not broken
      #   code.
      - name: Read the containment term (H6)
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-containment-term.ts \
            --rows artifacts/agentic/containment.ndjson \
            --depth artifacts/agentic/depth.ndjson \
            --per-case artifacts/agentic/per-case.ndjson \
            --output artifacts/agentic/containment-term.json \
            2>&1 | tee artifacts/agentic/containment-term.txt
          {
            echo '### H6 — the residual as a term, cross-fitted'
            echo ''
            echo '```'
            grep -E '^  (rows=|population|phi |transfers|moved=|reach |arm=|lambda sweep:|    lambda=|criterion:|H6-term:)' \
              artifacts/agentic/containment-term.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── H7: the containment pass reading every channel instead of one family ───────────────────────────────
      #
      #   Every containment arm before this one priced the RULE: the interface record (§12), the residual as a
      #   requirement (§299) and as a term (§300). §289 named the other ceiling — the pass reads
      #   `latencyExcursions`, one channel family — and nothing had swapped the MEASUREMENT while holding the rule
      #   fixed, because the pass takes a plain map and the swap therefore needed a second map in the artifact
      #   before it could be walked at all.
      #
      #   `channelSurprise` is that map: each candidate's post-injection window over EVERY published channel,
      #   priced by the rate at which that channel fires while nothing is wrong (`log(1/q)`, with `q` smoothed by
      #   one pseudo-count so that a channel that never fired is finite). Because the pass is unchanged, the arm is
      #   one walk of one chain with one map swapped — a statement about the measurement and not about the rule.
      #
      #   The three arms are the fusion baseline, the shipped latency arm, and the surprise arm. The `opened`
      #   census is the reason the step exists: the arm REPLACES latency, so its Top@1 is expected to sell the
      #   cases the shipped pass fixed, and the number that decides whether a union is worth building is how many
      #   pairs the second measurement opened and under WHICH of the shipped walk's refusals.
      #
      #   Exit 3 is the three instrument failures — no walkable chain, a chain carrying no surprise map, a shipped
      #   replay that does not reproduce the published top-1. A measured FAIL leaves the job green.
      - name: Read the containment surprise (H7)
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-containment-surprise.ts \
            --rows artifacts/agentic/containment.ndjson \
            --per-case artifacts/agentic/per-case.ndjson \
            --output artifacts/agentic/containment-surprise.json \
            2>&1 | tee artifacts/agentic/containment-surprise.txt
          {
            echo '### H7 — the pass reading every channel instead of one family'
            echo ''
            echo '```'
            grep -E '^  (rows=|moved=|arm=|decisions |opened |criterion:|H7-surprise:)' \
              artifacts/agentic/containment-surprise.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── H8: the interface record kept as a veto, and dropped as a licence ──────────────────────────────────
      #
      #   Every containment arm before this one moved a STATISTIC: the residual as a requirement, as a term, or
      #   the channel set behind the measurement. This one moves a WORD. The shipped rule refuses a pair whose
      #   own edge carried no failed call, and that single refusal merges two statements:
      #
      #     - the case recorded failed calls SOMEWHERE, so a call passed between these two and completed — the
      #       record vetoes the promotion, correctly (`+15 / −0`, and §299's three losses are what it buys);
      #     - the case recorded none AT ALL, so the record is silent about the case and says nothing about this
      #       pair — and refusing here discards the eighteen gains §299 measured and could not keep.
      #
      #   `ContainmentOrderInput.recordScope: 'case'` is that distinction. Nothing is fitted: the residual is
      #   the same cross-fitted prior the `prior` arm carries, the threshold is the shipped `0`, and the margin,
      #   the measurement and the inequality are untouched. An improvement here is not a coefficient that
      #   happened to fit the corpus.
      #
      #   The `ceiling` line is the other reason the step exists. A sweep visits adjacent positions from the top
      #   and never revisits one, so a candidate ascends exactly one place and only the pair at positions 0 and 1
      #   can change the published head. The cases ANY arm on this axis can fix are therefore countable before
      #   any arm is run, and every Top@1 above is spending against that number rather than against a
      #   percentage.
      #
      #   Exit 3 is the three instrument failures — no walkable chain, a partial chain, a shipped replay that
      #   does not reproduce the published top-1. A measured FAIL leaves the job green.
      - name: Read the containment veto (H8)
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-containment-veto.ts \
            --rows artifacts/agentic/containment.ndjson \
            --per-case artifacts/agentic/per-case.ndjson \
            --output artifacts/agentic/containment-veto.json \
            2>&1 | tee artifacts/agentic/containment-veto.txt
          {
            echo '### H8 — the interface record kept as a veto and dropped as a licence'
            echo ''
            echo '```'
            grep -E '^  (rows=|prior |arm=|decisions |control |ceiling |criterion:|H8-veto:)' \
              artifacts/agentic/containment-veto.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The study reads the ARTIFACT and nothing else. `joinHeadroom` refuses to pair a fingerprint with
      # a verdict whose published order disagrees, because two artifacts from different runs would
      # produce a number for a configuration neither of them ran -- and the CLI exits non-zero on that
      # refusal, so this job fails rather than printing a confident table over a broken join.
      - name: Score the ceiling, the evidence arm and the control
        run: |
          set -o pipefail
          WEIGHT_ARG=()
          if [ -n "${{ inputs.weight }}" ]; then
            WEIGHT_ARG=(--weight "${{ inputs.weight }}")
          fi
          pnpm exec tsx benchmarks/src/run-agentic-headroom.ts \
            --fingerprints artifacts/agentic/fingerprints.ndjson \
            --verdicts artifacts/agentic/per-case.ndjson \
            "${WEIGHT_ARG[@]}" 2>&1 | tee artifacts/agentic/headroom.txt

      # ── The model arm ────────────────────────────────────────────────────────────────────────────────────────
      #
      #   What this step adds to the two above is the one thing they cannot produce: an ANSWER. `--propose` builds a
      #   prompt per case from the fingerprint, asks the endpoint, reads the reply through the protocol parser,
      #   records it with the prompt digest it belongs to, and then scores four arms — control, ceiling, evidence and
      #   the model's own verified claims. The other readings of that answer (a weight sweep, a skip-rule sweep, a
      #   wider presentation) are re-reads of the claims file and cost nothing.
      #
      #   The corpus is not here and cannot be: this job reads artifacts only. That is the property that keeps a
      #   number from being an accident of the data a machine happened to hold.
      #   Skipped on a query-arm dispatch for the same reason the nomination step is: this is the third paid arm in
      #   the workflow, and a dispatch that buys one arm must not buy three. The offline arms it scores beside still
      #   run, so the control rows survive.
      - name: Ask the model to eliminate, then score every arm
        if: env.HAS_MODEL_KEY == 'true' && inputs.query_agent_sample == '' && !inputs.query_channel_split
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-agentic-eliminator.ts \
            --fingerprints artifacts/agentic/fingerprints.ndjson \
            --verdicts artifacts/agentic/per-case.ndjson \
            --claims artifacts/agentic/claims.ndjson \
            --propose \
            --model "${{ inputs.model }}" \
            --concurrency 6 2>&1 | tee artifacts/agentic/eliminator.txt

      # ── The second expression protocol ───────────────────────────────────────────────────────────────────────
      #
      #   The elimination study above measures what a MOVE costs to express: a promotion must be spelled as one
      #   elimination per candidate above it, each citing a channel printed on both rows and outside the removed
      #   row's band. The `union` column of the ceiling report is that cost, in points. This step asks the same
      #   table the same question and lets the answer be a ranking, which is the only difference between the two
      #   protocols — the table itself is rendered by one function, so a difference between the arms is a
      #   difference in what was asked and not in what was shown.
      #
      #   A nomination is verified, not trusted: a service the posterior does not carry is refused by name, a repeat
      #   is refused, and a refused case keeps its engine answer so the denominator stays the corpus.
      #   The nomination arm is skipped when the dispatch asked for the free-investigation arm, because the two are
      #   PAID and independent: a dispatch that wants the query arm is not also buying a second 1 422-case
      #   nomination pass, and a bill that names one arm must not contain the other. The offline arms below still
      #   run, so a query-arm dispatch still reads the elimination and fusion control rows.
      - name: Ask the model to rank, then score the nomination arm
        if: env.HAS_MODEL_KEY == 'true' && inputs.query_agent_sample == '' && !inputs.query_channel_split
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          #   THREE derived arguments, each stated by an input rather than by this file:
          #
          #   - `--max-candidates` / `--max-ranked` follow `fingerprint_top_k`, so ONE number states one window.
          #     Two inputs for one decision is how a dispatch comes to show a twenty-wide table while scoring the
          #     five-wide answer. `0` is not forwarded: it is the measure step's spelling of "every candidate" and
          #     the nomination parser has no such sentinel, so forwarding it would be read as a malformed width.
          #   - `--depth` is the terms dump, which the gate divides by. Passed only when it exists, so a study over
          #     an older artifact still runs its fusion arms; a `--promotion` without it is refused by the parser.
          #   - `--promotion` is the gate itself. `off` is the control and a number is the arm.
          WIDTH_ARG=()
          if [ -n "${{ inputs.fingerprint_top_k }}" ] && [ "${{ inputs.fingerprint_top_k }}" != "0" ]; then
            WIDTH_ARG=(--max-candidates "${{ inputs.fingerprint_top_k }}" --max-ranked "${{ inputs.fingerprint_top_k }}")
          fi
          DEPTH_ARG=()
          if [ -f artifacts/agentic/terms.ndjson ]; then
            DEPTH_ARG=(--depth artifacts/agentic/terms.ndjson)
          fi
          PROMOTION_ARG=()
          if [ -n "${{ inputs.promotion }}" ]; then
            PROMOTION_ARG=(--promotion "${{ inputs.promotion }}")
          fi
          #   `--topology-brief` names the artifact the measure job staged, and it is passed by PRESENCE for the
          #   reason `--depth` above is: the file exists only because an input asked for it, so its absence IS the
          #   default and a study over an older artifact still runs its fusion arms. It is NOT derived from the
          #   input directly -- a dispatch that named `auto` while the artifact is missing would measure the control
          #   under the arm's name, which is the one outcome a channel arm cannot survive.
          BRIEF_ARG=()
          if [ -f artifacts/agentic/topology.ndjson ]; then
            BRIEF_ARG=(--topology-brief artifacts/agentic/topology.ndjson)
          fi
          #   The TABLE comes from the presentation dump when the measure job wrote one, and from the published
          #   fingerprint otherwise. Presence rather than a second reading of the input, on the rule `--depth`
          #   above follows: the file exists only because that input asked for it, so its absence IS the default,
          #   and a study over an older artifact still runs. The offline arms above and below keep the PUBLISHED
          #   dump -- their join indexes it against the verdict file, and this arm is the only reader whose input
          #   is allowed to be a rendering.
          FINGERPRINTS=artifacts/agentic/fingerprints.ndjson
          if [ -f artifacts/agentic/presentation.ndjson ]; then
            FINGERPRINTS=artifacts/agentic/presentation.ndjson
          fi
          pnpm exec tsx benchmarks/src/run-agentic-nomination.ts \
            --fingerprints "$FINGERPRINTS" \
            --verdicts artifacts/agentic/per-case.ndjson \
            --nominations artifacts/agentic/nominations.ndjson \
            --propose \
            --model "${{ inputs.model }}" \
            "${WIDTH_ARG[@]}" \
            "${DEPTH_ARG[@]}" \
            "${PROMOTION_ARG[@]}" \
            "${BRIEF_ARG[@]}" \
            --concurrency 6 2>&1 | tee artifacts/agentic/nomination.txt

      - name: Say why the nomination arm did not run
        if: env.HAS_MODEL_KEY != 'true' || inputs.query_agent_sample != '' || inputs.query_channel_split
        run: |
          if [ "${{ inputs.query_channel_split }}" = "true" ]; then
            echo "NOMINATION ARM NOT MEASURED: this dispatch asked for the channel census, which is uncounted" \
              "evidence re-reading, and the paid arms are independent" | tee artifacts/agentic/nomination.txt
          elif [ "${{ inputs.query_agent_sample }}" != "" ]; then
            echo "NOMINATION ARM NOT MEASURED: this dispatch asked for the free-investigation arm, and the" \
              "two are paid and independent" | tee artifacts/agentic/nomination.txt
          else
            echo "::warning::DEEPSEEK_API_KEY is not available to this job, so the nomination arm was NOT MEASURED"
            echo "NOMINATION ARM NOT MEASURED: DEEPSEEK_API_KEY is not available to this job" \
              | tee artifacts/agentic/nomination.txt
          fi

      #   Without a key the model arm is NOT MEASURED, and the difference between that and a bad score has to be
      #   visible: the offline arms still run, and the reason the fourth one did not is printed by name rather than
      #   left as a missing row a reader would take for a refusal.
      - name: Say why the model arm did not run
        if: env.HAS_MODEL_KEY != 'true' || inputs.query_agent_sample != '' || inputs.query_channel_split
        run: |
          if [ "${{ inputs.query_channel_split }}" = "true" ]; then
            echo "MODEL ARM NOT MEASURED: this dispatch asked for the channel census, which is uncounted" \
              "evidence re-reading, and the paid arms are independent" | tee artifacts/agentic/eliminator.txt
          elif [ "${{ inputs.query_agent_sample }}" != "" ]; then
            echo "MODEL ARM NOT MEASURED: this dispatch asked for the free-investigation arm, and the paid arms" \
              "are independent" | tee artifacts/agentic/eliminator.txt
          else
            echo "::warning::DEEPSEEK_API_KEY is not available to this job, so the model arm was NOT MEASURED"
            echo "MODEL ARM NOT MEASURED: DEEPSEEK_API_KEY is not available to this job" \
              | tee artifacts/agentic/eliminator.txt
          fi

      - name: Score the offline arms beside it
        if: env.HAS_MODEL_KEY != 'true'
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-agentic-eliminator.ts \
            --fingerprints artifacts/agentic/fingerprints.ndjson \
            --verdicts artifacts/agentic/per-case.ndjson 2>&1 | tee -a artifacts/agentic/eliminator.txt

      # The two numbers that bound every arm, and the curve that says which of them a gap belongs to.
      #
      #   Placed AFTER the proposal step on purpose: `--claims` is the artifact that step writes, and a ceiling
      #   read from a file that does not exist yet would print the engine row and call the protocol free.
      #
      #   `union` is the accuracy of "the engine, or the arm" — the ceiling of the elimination protocol on this
      #   population, which no model can exceed however well it reads. `reader` is the truth-in-posterior share,
      #   which no protocol can exceed. When the two differ, the difference is what the protocol costs to SAY an
      #   answer, and that is a property of the question rather than of the model. Both are free: they are computed
      #   from the same artifacts the steps above already read.
      - name: Report the protocol ceilings and the recall curve
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-agentic-ceiling.ts \
            --fingerprints artifacts/agentic/fingerprints.ndjson \
            --verdicts artifacts/agentic/per-case.ndjson \
            --claims artifacts/agentic/claims.ndjson \
            --depth artifacts/agentic/depth.ndjson 2>&1 | tee artifacts/agentic/ceiling.txt

      - name: Upload the study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-headroom
          path: |
            artifacts/agentic/headroom.txt
            artifacts/agentic/depth.txt
            artifacts/agentic/eliminator.txt
            artifacts/agentic/claims.ndjson
            artifacts/agentic/ceiling.txt
            artifacts/agentic/containment.txt
            artifacts/agentic/containment-residual.json
            artifacts/agentic/containment-gate.txt
            artifacts/agentic/containment-gate.json
            artifacts/agentic/containment-term.txt
