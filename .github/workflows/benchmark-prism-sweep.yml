name: Benchmark — PRISM Weight Sweep

# Readback workflow for the prismWeight zero-regression frontier. Runs the
# production configuration (logWeight=1 + traceWeight=1 + rankNormalization)
# at a continuum of prismWeight values on the SAME 615 RCAEval cases the
# ablation evaluates, and reports the set of weights where NO (system,
# fault-type) cell's AC@1 falls below its weight-0 baseline — the gating
# experiment for flipping prismWeight's default vs moving to per-context
# routing. Each suite is a separate parallel job; the three JSON payloads are
# merged locally after readback.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep-re1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Run PRISM sweep — RE1
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-ablation.ts --data-dir ~/RCAEval-json --suite re1 --prism-sweep 2>&1 | tee prism-sweep-re1.txt
      - name: Upload RE1 sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-sweep-re1
          path: |
            prism-sweep-re1.txt
            prism-sweep-re1.json

  sweep-re2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Run PRISM sweep — RE2
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-ablation.ts --data-dir ~/RCAEval-json --suite re2 --max-cases 50 --prism-sweep 2>&1 | tee prism-sweep-re2.txt
      - name: Upload RE2 sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-sweep-re2
          path: |
            prism-sweep-re2.txt
            prism-sweep-re2.json

  sweep-re3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Run PRISM sweep — RE3
        env:
          ZHIPU_EMBEDDING_ENDPOINT: https://api.z.ai/api/paas/v4/embeddings
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -o pipefail
          pnpm exec tsx benchmarks/src/run-ablation.ts --data-dir ~/RCAEval-json --suite re3 --prism-sweep 2>&1 | tee prism-sweep-re3.txt
      - name: Upload RE3 sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-sweep-re3
          path: |
            prism-sweep-re3.txt
            prism-sweep-re3.json
