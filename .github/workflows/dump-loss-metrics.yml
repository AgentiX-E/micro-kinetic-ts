name: Dump Fault Metric Signature

# One-off diagnostic: characterize a fault type's metric signature across
# RE1/RE2. The routing probe showed `loss` is the largest bothWrong contributor
# (34/77) with the worst union rate (66.7%; engine 55.9% / PRISM 52.0%); the
# same dump now generalises to any fault type (e.g. `delay`, the last fault type
# with deterministic headroom). This dump answers whether the GT source shows
# ANY metric deviation and in what direction (rise vs drop) and metric name,
# deciding whether the fault type is deterministically crackable. Dispatched
# manually; uploads a text artifact.

on:
  workflow_dispatch:
    inputs:
      fault_type:
        description: 'Fault type to dump (loss, delay, cpu, mem, disk, socket)'
        required: false
        default: 'loss'
        type: string

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Restore cached RCAEval JSON
        uses: actions/cache/restore@v4
        with:
          path: ~/RCAEval-json
          key: RCAEvalJSON
          restore-keys: |
            RCAEval-json-
      - name: Dump ${{ inputs.fault_type }} metric signature
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          pnpm exec tsx scripts/dump-loss-metrics.ts \
            --data-dir ~/RCAEval-json \
            --fault-type "${{ inputs.fault_type }}" 2>&1 | tee "dump-${{ inputs.fault_type }}-metrics.txt"
      - name: Upload dump artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump-${{ inputs.fault_type }}-metrics
          path: dump-${{ inputs.fault_type }}-metrics.txt
