# TrainTicket Service Topology
# Source: https://github.com/FudanSELab/train-ticket
# Architecture: ~64 microservices across 3 layers (UI, Gateway, Business)
#
# Known issue: 95 edges defined here but RCAEval dataset has 64 services
# in typical cases — only ~36 services match due to dataset subsetting.
# The semantic alignment layer handles unresolved services via embedding
# similarity matching.
#
# Key dependency patterns:
#   ts-ui → ALL business services (ts-ui is the unified frontend)
#   ts-order-service → ts-travel-service, ts-price-service, etc.
#   ts-preserve-service → ts-seat-service, ts-train-service
#   ts-admin-* → ts-auth + target business service
#   ts-food-service chain → station-food, train-food, food-delivery
#   ts-consign-service chain → consign-price, delivery
#   ts-payment-service → inside-payment, voucher

version: "1.0"
system: TrainTicket
description: "Fudan Train Ticket benchmark — 64 microservices"
source: "https://github.com/FudanSELab/train-ticket"

